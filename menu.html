<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Меню – Әдебиет ордасы</title>

   <link rel="icon" href="images/logo.png" type="image/png">

<style>
* {box-sizing:border-box;}
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),url("images/kazakh-dalasy.jpg") center/cover no-repeat;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
nav {
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}
nav button {
  margin:12px 0;
  padding:16px 0;
  width:220px; /* бірдей өлшем */
  font-size:20px; /* бірдей өлшем */
  border:2px solid #d4af37; /* тек жиегі алтын түстес */
  border-radius:10px;
  background:transparent; /* фон толық прозрачный */
  color:#d4af37; /* текст алтын түстес */
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}
nav button:hover {
  background:rgba(212,175,55,0.2); /* жеңіл алтын фоны hover кезінде */
  color:#000; /* текст қараға ауысады */
  transform:scale(1.05); /* сәл үлкейту эффекті */
}
.account-icon {
  position:absolute;
  top:15px;
  left:15px;
  width:55px;
  height:55px;
  border-radius:50%;
  background:#ffa500;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:28px;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,0.5);
}
@media(max-width:600px){
  nav button {
    width:80%;
    padding:14px 0;
    font-size:18px;
  }
  .account-icon{
    width:50px;
    height:50px;
    font-size:26px;
  }
}
</style>
</head>

<body>

<div class="account-icon" id="accountIcon">👤</div>

<nav>
<button onclick="location.href='index.html'">Басты бет</button>
<button onclick="location.href='alash.html'">Алаш зиялылары</button>
<button onclick="location.href='writers.html'">Қазақ жазушылары</button>
<button onclick="location.href='poets.html'">Ақындар</button>
<button onclick="location.href='poemGame.html'">Қаламгер ойыны</button>
<button onclick="location.href='contact.html'">Байланыс</button>
<button onclick="location.href='poems.html'">Өлеңдер</button>
</nav>

<script>
// Аккаунт белгісі login бетіне бағыттайды
document.getElementById("accountIcon").addEventListener("click", ()=>{
  location.href = 'login.html';
});
</script>

</body>
</html>
