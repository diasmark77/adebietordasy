<style>
* {box-sizing:border-box;}
body {
  margin:0;font-family:Arial,sans-serif;background:#f4f1ea;color:#333;line-height:1.5;
  /* Мазмұн төмендегі қалқыма тіл-бар астында қалып қоймас үшін */
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
}

header {
  background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url("images/kazakh-dalasy.jpg") center/cover no-repeat;

header h1 {font-size:42px;margin-bottom:10px;}

.search-box {
  text-align:center;

.search-box input {
  width:80%;

  font-size:16px;

  border:1px solid #ccc;
}

section {
  padding:0 15px 50px 15px;

  margin:auto;
}

.section-title {
  font-size: 18px; color: #8b5e3c; font-weight: bold;
  margin: 30px 0 10px; padding-bottom: 8px;
  border-bottom: 2px solid #d3cdc0;
}

.card {
  background:white;
  padding:20px;
  margin:15px 0;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-height:200px;
  cursor: pointer;
  transition: 0.3s;
  text-decoration: none;
  color: inherit;
  display: block;
}
.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

.card.from-db { border-left: 5px solid #8b5e3c; }
.genre-badge {
  display: inline-block; font-size: 11px; font-weight: bold;
  padding: 2px 8px; border-radius: 10px; margin-left: 8px;
  background: rgba(139,94,60,0.12); color: #8b5e3c;
  border: 1px solid rgba(139,94,60,0.3); vertical-align: middle;
}

.card h2 {color:#5c4033; font-size:20px; margin-bottom:10px;}

.card pre {
  white-space: pre-wrap;
  word-wrap: break-word;
  font-family: 'Georgia', serif;
  font-size:16px;
  margin:0;
  display:-webkit-box;
  -webkit-line-clamp:4;
  -webkit-box-orient:vertical;
  overflow:hidden;
  color: #555;
}

.card .read-more {
  display:inline-block;
  margin-top:10px;
  color:#8b5e3c;
  font-weight:bold;
  text-decoration:none;
}

.loading { text-align: center; font-size: 1.2rem; color: #8b5e3c; padding: 40px; }

footer {
  background:#5c4033;
  color:white;
  text-align:center;
  padding:15px;
  margin-top:30px;
  font-size:14px;
}

@media(max-width:600px){
  .search-box input {width:95%;}
  .card h2 {font-size:18px;}
  .card pre {font-size:15px;}

/* ═══════════════════════════════════════════════
   ТӨМЕНГІ МЕНЮ — iOS/Instagram стиліндегі tab bar
   (index.html беттегі стильмен бірдей)
   ═══════════════════════════════════════════════ */
nav.tabbar {
  all: unset !important;
  box-sizing: border-box !important;
  display: flex !important;
  flex-direction: row !important;
  position: fixed !important;
  top: auto !important;
  left: 10px !important;
  right: 10px !important;
  bottom: calc(10px + env(safe-area-inset-bottom)) !important;
  width: auto !important;
  height: auto !important;
  min-height: 0 !important;
  max-width: 520px !important;
  margin: 0 auto !important;
  transform: none !important;
  transition: none !important;
  align-items: stretch !important;
  justify-content: space-around !important;
  background: rgba(250, 247, 240, 0.92) !important;
  -webkit-backdrop-filter: saturate(180%) blur(20px) !important;
  backdrop-filter: saturate(180%) blur(20px) !important;
  border: 1px solid rgba(139, 94, 60, 0.14) !important;
  border-radius: 26px !important;
  box-shadow: 0 8px 28px rgba(44, 24, 16, 0.16) !important;
  padding: 8px 6px !important;
  z-index: 1000 !important;
}

.tabbar-indicator {
  position: absolute;
  top: 6px;
  height: 46px;
  border-radius: 20px;
  background: rgba(139, 94, 60, 0.13);
  box-shadow: inset 0 0 0 1px rgba(139, 94, 60, 0.16);
  transition: left 0.35s cubic-bezier(.34,1.56,.64,1),
              width 0.35s cubic-bezier(.34,1.56,.64,1),
              opacity 0.2s ease;
  pointer-events: none;
  opacity: 0;
}

.tabbar a {
  flex: 1 1 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  text-decoration: none;
  color: #9c8874;
  padding: 9px 2px 7px;
  min-height: 46px;
  border-radius: 20px;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.25s ease, transform 0.15s ease;
  position: relative;
  z-index: 1;
}

.tabbar a svg {
  width: 25px;
  height: 25px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
}

.tabbar a span {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.1px;
  line-height: 1.1;
  white-space: nowrap;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.tabbar a:active {
  transform: scale(0.92);
}

.tabbar a.active {
  color: #6e472c;
}

.tabbar a.active svg {
  transform: translateY(-1px) scale(1.08);
}

.tabbar-indicator.dragging {
  transform: scale(1.05);
  box-shadow: inset 0 0 0 1.5px rgba(139, 94, 60, 0.35), 0 6px 16px rgba(139, 94, 60, 0.28);
}

.tabbar a.active {
  cursor: grab;
  touch-action: none;
}

.tabbar a.active:active {
  cursor: grabbing;
}

.tabbar a.drag-hover {
  color: #6e472c;
}

.tabbar a.drag-hover svg {
  transform: translateY(-1px) scale(1.12);
}

@media (max-width: 380px) {
  .tabbar a span { font-size: 9.5px; }
  .tabbar a svg { width: 21px; height: 21px; }
}
</style>

<!-- ✅ Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ── Supabase конфигурациясы ──
const SUPABASE_URL = "https://rehdrlbhglnhajwtgohr.supabase.co";
const SUPABASE_KEY = "sb_publishable_9-WTtRK7KHkr8dQ7x30Yew_Syacj2vB";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let dbShygarmalar = [];

// ── Деректерді жүктеу ──
async function fetchShygarmalar() {
    const container = document.getElementById('db-shygarmalar-container');
    const section   = document.getElementById('db-shygarmalar-section');

    try {
        // Supabase: "shygarmalar" кестесінен барлық жазбаларды алу,
        // added_at бойынша кемуші ретпен сұрыптау
        const { data, error } = await supabaseClient
            .from('shygarmalar')
            .select('*')
            .order('added_at', { ascending: false });

        if (error) throw error;

        dbShygarmalar = data || [];

        if (dbShygarmalar.length > 0) {
            section.style.display = 'block';
            renderDbShygarmalar(dbShygarmalar);
        } else {
            container.innerHTML = '';
            section.style.display = 'none';
        }
    } catch (error) {
        console.error("❌ Supabase қатесі:", error);
        container.innerHTML = '';
        section.style.display = 'none';
    }
}

// ── Карточкаларды көрсету ──
function renderDbShygarmalar(list) {
    const container = document.getElementById('db-shygarmalar-container');
    const section   = document.getElementById('db-shygarmalar-section');

    container.innerHTML = '';

    if (list.length === 0) {
        section.style.display = 'none';
        return;
    }
    section.style.display = 'block';

    list.forEach(sh => {
        const title      = sh.title       || 'Шығарма';
        const authorName = sh.author_name || 'Белгісіз автор';
        const text       = sh.text_content || '';
        const preview    = text.substring(0, 200);
        const genreLabel = sh.genre_label  || '';

        const card = document.createElement('a');
        card.className = 'card from-db';
        card.href = `shygarma-view.html?id=${sh.id}`;

        card.innerHTML = `
            <h2>${authorName} &laquo;${title}&raquo;
                ${genreLabel ? `<span class="genre-badge">${genreLabel}</span>` : ''}
            </h2>
            <pre>${preview.replace(/</g,'&lt;')}${text.length > 200 ? '...' : ''}</pre>
            <span class="read-more">Толығырақ →</span>
        `;

        container.appendChild(card);
    });
}

// ── Іздеу ──
document.getElementById('searchInput').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase().trim();

    if (term) {
        const filtered = dbShygarmalar.filter(s =>
            (s.author_name  || '').toLowerCase().includes(term) ||
            (s.title        || '').toLowerCase().includes(term) ||
            (s.text_content || '').toLowerCase().includes(term)
        );
        renderDbShygarmalar(filtered);
    } else {
        renderDbShygarmalar(dbShygarmalar);
    }

    document.querySelectorAll('#static-shygarmalar .card').forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(term) ? '' : 'none';
    });
});

// ── Бастау ──
fetchShygarmalar();
</script>

<!-- ТІЛ-БАР инициализациясы (index.html беттегімен бірдей) -->
<script>
(function initTabbar() {
  const tabbar = document.getElementById('tabbar');
  const indicator = document.getElementById('tabbarIndicator');
  const tabs = Array.from(document.querySelectorAll('.tabbar a'));
  const current = location.pathname.split('/').pop() || 'index.html';

  tabs.forEach(a => a.classList.toggle('active', a.dataset.page === current));

  function getTabBox(tab) {
    const barRect = tabbar.getBoundingClientRect();
    const tabRect = tab.getBoundingClientRect();
    const pad = 6;
    return {
      left: tabRect.left - barRect.left + pad,
      width: tabRect.width - pad * 2
    };
  }

  function movePillTo(tab, animate) {
    if (!tab) { indicator.style.opacity = '0'; return; }
    const box = getTabBox(tab);
    indicator.style.transition = animate
      ? 'left 0.35s cubic-bezier(.34,1.56,.64,1), width 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.2s ease'
      : 'opacity 0.2s ease';
    indicator.style.left = box.left + 'px';
    indicator.style.width = box.width + 'px';
    indicator.style.opacity = '1';
  }

  function positionPill() {
    const activeTab = tabs.find(a => a.classList.contains('active'));
    movePillTo(activeTab, false);
  }

  positionPill();
  window.addEventListener('load', positionPill);
  window.addEventListener('resize', positionPill);

  let ignoreNextClick = false;

  function goToTab(tab) {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    movePillTo(tab, true);
    const href = tab.getAttribute('href');
    setTimeout(() => { location.href = href; }, 260);
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', function (e) {
      if (ignoreNextClick) { ignoreNextClick = false; e.preventDefault(); return; }
      if (tab.classList.contains('active')) return;
      e.preventDefault();
      goToTab(tab);
    });
  });

  let isDragging = false;
  let dragMoved = false;
  let activePointerId = null;

  tabbar.style.userSelect = 'none';
  tabbar.style.webkitUserSelect = 'none';

  tabbar.addEventListener('pointerdown', (e) => {
    const tab = e.target.closest('a');
    if (!tab || !tab.classList.contains('active')) return;
    isDragging = true;
    dragMoved = false;
    activePointerId = e.pointerId;
    try { tabbar.setPointerCapture(e.pointerId); } catch (err) {}
    indicator.classList.add('dragging');
    document.body.style.cursor = 'grabbing';
  });

  tabbar.addEventListener('pointermove', (e) => {
    if (!isDragging || e.pointerId !== activePointerId) return;
    dragMoved = true;
    e.preventDefault();

    const x = e.clientX;
    let targetTab = null;
    for (const tab of tabs) {
      const r = tab.getBoundingClientRect();
      if (x >= r.left && x <= r.right) { targetTab = tab; break; }
    }

    tabs.forEach(t => t.classList.remove('drag-hover'));
    if (targetTab) {
      targetTab.classList.add('drag-hover');
      indicator.style.transition = 'left 0.12s ease, width 0.12s ease';
      const box = getTabBox(targetTab);
      indicator.style.left = box.left + 'px';
      indicator.style.width = box.width + 'px';
    }
  }, { passive: false });

  function endDrag(e) {
    if (!isDragging) return;
    isDragging = false;
    document.body.style.cursor = '';
    indicator.classList.remove('dragging');

    const dropTab = tabs.find(t => t.classList.contains('drag-hover'));
    tabs.forEach(t => t.classList.remove('drag-hover'));

    if (dropTab && dragMoved) {
      if (dropTab.classList.contains('active')) {
        movePillTo(dropTab, true);
      } else {
        ignoreNextClick = true;
        setTimeout(() => { ignoreNextClick = false; }, 500);
        goToTab(dropTab);
      }
    } else {
      const activeTab = tabs.find(t => t.classList.contains('active'));
      movePillTo(activeTab, true);
    }
    dragMoved = false;
  }

  tabbar.addEventListener('pointerup', endDrag);
  tabbar.addEventListener('pointercancel', endDrag);
})();
</script>
