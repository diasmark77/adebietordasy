<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шығармалар | Әдебиет ордасы</title>
<meta name="description" content="Әдебиет ордасы сайтында қазақ әдеби шығармаларының жинағы: әңгімелер, романдар және поэмалар ұсынылған.">
<meta name="keywords" content="әдебиет ордасы, әдеби шығармалар, қазақ әдебиеті, әңгімелер, романдар, поэмалар">
  
<link rel="icon" href="images/logo.png" type="image/png">
<link rel="stylesheet" href="css/menu.css">
  
<style>
* {box-sizing:border-box;}
body {margin:0;font-family:Arial,sans-serif;background:#f4f1ea;color:#333;line-height:1.5;}

header {
  background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url("images/kazakh-dalasy.jpg") center/cover no-repeat;
  color:white;
  text-align:center;
  padding:50px 20px;
}
header h1 {font-size:42px;margin-bottom:10px;}
header p {font-size:18px;opacity:0.9;}

nav {
  display:none;
  flex-direction:column;
  background:#8b5e3c;
}
nav button {
  background:none;
  border:none;
  color:white;
  padding:14px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
  border-top:1px solid rgba(255,255,255,0.2);
}
nav button:hover {background:#6e472c;}
nav.show{display:flex;}

.search-box {
  text-align:center;
  margin:20px 0;
}
.search-box input {
  width:80%;
  max-width:400px;
  padding:10px 12px;
  font-size:16px;
  border-radius:5px;
  border:1px solid #ccc;
}

section {
  padding:0 15px 50px 15px;
  max-width:900px;
  margin:auto;
}

.section-title {
  font-size: 18px; color: #8b5e3c; font-weight: bold;
  margin: 30px 0 10px; padding-bottom: 8px;
  border-bottom: 2px solid #d3cdc0;
}

.card {
  background:white;
  padding:20px;
  margin:15px 0;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-height:200px;
  cursor: pointer;
  transition: 0.3s;
  text-decoration: none;
  color: inherit;
  display: block;
}
.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

.card.from-db { border-left: 5px solid #8b5e3c; }
.genre-badge {
  display: inline-block; font-size: 11px; font-weight: bold;
  padding: 2px 8px; border-radius: 10px; margin-left: 8px;
  background: rgba(139,94,60,0.12); color: #8b5e3c;
  border: 1px solid rgba(139,94,60,0.3); vertical-align: middle;
}

.card h2 {color:#5c4033; font-size:20px; margin-bottom:10px;}

.card pre {
  white-space: pre-wrap;
  word-wrap: break-word;
  font-family: 'Georgia', serif;
  font-size:16px;
  margin:0;
  display:-webkit-box;
  -webkit-line-clamp:4;
  -webkit-box-orient:vertical;
  overflow:hidden;
  color: #555;
}

.card .read-more {
  display:inline-block;
  margin-top:10px;
  color:#8b5e3c;
  font-weight:bold;
  text-decoration:none;
}

.loading { text-align: center; font-size: 1.2rem; color: #8b5e3c; padding: 40px; }

footer {
  background:#5c4033;
  color:white;
  text-align:center;
  padding:15px;
  margin-top:30px;
  font-size:14px;
}

@media(max-width:800px){
  .menu-btn{display:block;}
  nav{display:none;}
  nav.show{display:flex;}
}
@media(max-width:600px){
  nav button {width:90%; margin:3px 0;}
  .search-box input {width:95%;}
  .card h2 {font-size:18px;}
  .card pre {font-size:15px;}
}
</style>
</head>
<body>

<header>
<h1>📚 Әдебиет ордасы</h1>
<p>Қазақ руханиятының әдеби ордасы</p>
</header>

<button class="menu-btn" onclick="toggleMenu()">☰</button>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<nav id="menu">
<button onclick="location.href='index.html'">🏠 Басты бет</button>
<button onclick="location.href='authors-filtre.html'">✍️ Авторлар</button>
<button onclick="location.href='poemGame.html'">🎮 Қаламгер ойыны</button>
<button onclick="location.href='contact.html'">📩 Байланыс</button>
<button onclick="location.href='poems.html'">📝 Өлеңдер</button>
<button onclick="location.href='shygarms.html'">📑 Шығармалар</button>
</nav>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Іздеу авторлар мен шығармалар бойынша...">
</div>

<section>

  <!-- Supabase-тен шығармалар -->
  <div id="db-shygarmalar-section" style="display:none;">
    <div id="db-shygarmalar-container">
      <div class="loading">Жүктелуде...</div>
    </div>
  </div>

  <!-- Статикалық шығармалар -->
 
</section>

<footer>
© 2026 Әдебиет ордасы | Қазақ әдеби порталы
</footer>

<!-- ✅ Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ── Supabase конфигурациясы ──
const SUPABASE_URL = "https://rehdrlbhglnhajwtgohr.supabase.co";
const SUPABASE_KEY = "sb_publishable_9-WTtRK7KHkr8dQ7x30Yew_Syacj2vB";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let dbShygarmalar = [];

// ── Деректерді жүктеу ──
async function fetchShygarmalar() {
    const container = document.getElementById('db-shygarmalar-container');
    const section   = document.getElementById('db-shygarmalar-section');

    try {
        // Supabase: "shygarmalar" кестесінен барлық жазбаларды алу,
        // added_at бойынша кемуші ретпен сұрыптау
        const { data, error } = await supabaseClient
            .from('shygarmalar')
            .select('*')
            .order('added_at', { ascending: false });

        if (error) throw error;

        dbShygarmalar = data || [];

        if (dbShygarmalar.length > 0) {
            section.style.display = 'block';
            renderDbShygarmalar(dbShygarmalar);
        } else {
            container.innerHTML = '';
            section.style.display = 'none';
        }
    } catch (error) {
        console.error("❌ Supabase қатесі:", error);
        container.innerHTML = '';
        section.style.display = 'none';
    }
}

// ── Карточкаларды көрсету ──
function renderDbShygarmalar(list) {
    const container = document.getElementById('db-shygarmalar-container');
    const section   = document.getElementById('db-shygarmalar-section');

    container.innerHTML = '';

    if (list.length === 0) {
        section.style.display = 'none';
        return;
    }
    section.style.display = 'block';

    list.forEach(sh => {
        const title      = sh.title       || 'Шығарма';
        const authorName = sh.author_name || 'Белгісіз автор';
        const text       = sh.text_content || '';
        const preview    = text.substring(0, 200);
        const genreLabel = sh.genre_label  || '';

        const card = document.createElement('a');
        card.className = 'card from-db';
        card.href = `shygarma-view.html?id=${sh.id}`;

        card.innerHTML = `
            <h2>${authorName} &laquo;${title}&raquo;
                ${genreLabel ? `<span class="genre-badge">${genreLabel}</span>` : ''}
            </h2>
            <pre>${preview.replace(/</g,'&lt;')}${text.length > 200 ? '...' : ''}</pre>
            <span class="read-more">Толығырақ →</span>
        `;

        container.appendChild(card);
    });
}

// ── Іздеу ──
document.getElementById('searchInput').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase().trim();

    if (term) {
        const filtered = dbShygarmalar.filter(s =>
            (s.author_name  || '').toLowerCase().includes(term) ||
            (s.title        || '').toLowerCase().includes(term) ||
            (s.text_content || '').toLowerCase().includes(term)
        );
        renderDbShygarmalar(filtered);
    } else {
        renderDbShygarmalar(dbShygarmalar);
    }

    document.querySelectorAll('#static-shygarmalar .card').forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(term) ? '' : 'none';
    });
});

// ── Бастау ──
fetchShygarmalar();
</script>

<script>
function toggleMenu(){
  document.getElementById("menu").classList.toggle("show");
  document.getElementById("overlay").classList.toggle("show");
}
</script>

</body>
</html>
