<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Авторлар | Әдебиет ордасы</title>
<meta name="description" content="Әдебиет ордасы сайтындағы қазақ авторларының өмірбаяны, шығармашылығы және танымал шығармаларымен танысыңыз.">
<meta name="keywords" content="әдебиет ордасы, қазақ ақындары, жазушылар, алаш зиялылары, композиторлар">

<link rel="icon" href="images/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/menu.css">

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Open Sans', sans-serif;
  background: #f0ece3;
  color: #2e2418;
}

header {
  background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url("images/kazakh-dalasy.jpg") center/cover no-repeat;
  color: white;
  text-align: center;
  padding: 25px;
}
header h1 { margin: 0 0 6px; font-size: 2em; font-family: 'Merriweather', serif; }
header p  { margin: 0; opacity: 0.85; font-size: 15px; }

/* ── FILTER BAR ── */
.filter-section {
  text-align: center;
  padding: 24px 16px 8px;
}
.filter-bar {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 4px;
}
.filter-btn {
  padding: 8px 20px;
  border-radius: 24px;
  border: 2px solid #d3cdc0;
  background: white;
  color: #5c4033;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
  font-family: 'Open Sans', sans-serif;
}
.filter-btn:hover {
  border-color: #8b5e3c;
  background: #fdf5e6;
}
.filter-btn.active {
  background: #8b5e3c;
  border-color: #8b5e3c;
  color: white;
}

/* ── SEARCH ── */
.search-box {
  text-align: center;
  margin: 16px 0 24px;
}
.search-box input {
  width: 60%;
  max-width: 600px;
  padding: 12px 15px;
  font-size: 15px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-family: 'Open Sans', sans-serif;
  background: white;
  color: #2e2418;
}
.search-box input:focus {
  outline: none;
  border-color: #8b5e3c;
  box-shadow: 0 0 6px rgba(139,94,60,0.2);
}

/* ── CATEGORY LABEL on card ── */
.cat-label {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.4px;
  padding: 3px 9px;
  border-radius: 10px;
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 2;
}
.cat-aqyn       { background: rgba(237,232,251,0.95); color: #3C3489; }
.cat-jazushy    { background: rgba(230,241,251,0.95); color: #0C447C; }
.cat-alash      { background: rgba(250,238,218,0.95); color: #633806; }
.cat-kompozitor { background: rgba(225,245,238,0.95); color: #085041; }
.cat-static     { background: rgba(244,237,232,0.95); color: #5c4033; }

/* ── CARDS GRID ── */
.cards-container {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  padding: 0 28px 48px;
}

@media (max-width: 1100px) {
  .cards-container { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 760px) {
  .cards-container { grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 0 16px 36px; }
}
@media (max-width: 480px) {
  .cards-container { grid-template-columns: 1fr; gap: 12px; padding: 0 14px 28px; }
}

/* ── CARD ── */
.card {
  background: white;
  border-radius: 10px;
  border: 1px solid #e2dbd0;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  display: flex;
  flex-direction: column;
  position: relative;
  text-align: left;
  padding: 0;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 28px rgba(92,64,51,0.13);
  border-color: #c8b89a;
}

/* ── PORTRAIT PHOTO: 2:3 ratio — портреттік суреттер үшін ыңғайлы ── */
.card-img-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 2 / 3;
  background: #e8e0d4;
  overflow: hidden;
  flex-shrink: 0;
}
.card-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
  display: block;
  transition: transform 0.35s ease;
}
.card:hover .card-img-wrap img {
  transform: scale(1.03);
}

/* ── CARD BODY ── */
.card-body {
  padding: 12px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex: 1;
}
.card h2 {
  font-family: 'Merriweather', serif;
  font-size: 13.5px;
  font-weight: 700;
  color: #3a2410;
  margin: 0;
  line-height: 1.4;
}
.card p {
  margin: 0;
  font-family: 'Open Sans', sans-serif;
  font-size: 12px;
  color: #7a6a58;
  line-height: 1.6;
  flex: 1;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card a {
  display: inline-block;
  text-decoration: none;
  font-family: 'Open Sans', sans-serif;
  font-size: 12px;
  font-weight: 600;
  color: #8b5e3c;
  margin-top: 2px;
}
.card a:hover { color: #5c4033; text-decoration: underline; }

/* Hidden / Empty */
.card.hidden { display: none; }

.empty-msg {
  text-align: center;
  padding: 40px;
  color: #9a8866;
  font-size: 16px;
  display: none;
  grid-column: 1 / -1;
  font-family: 'Open Sans', sans-serif;
}

.loading-state {
  text-align: center;
  padding: 60px 20px;
  color: #8b5e3c;
  font-size: 15px;
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  font-family: 'Open Sans', sans-serif;
}
.loading-spinner {
  width: 34px;
  height: 34px;
  border: 3px solid #e8ddd4;
  border-top-color: #8b5e3c;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

footer { background: #5c4033; color: white; text-align: center; padding: 15px; margin-top: 10px; font-family: 'Open Sans', sans-serif; }
</style>
</head>
<body>

<header>
  <h1>Авторлар</h1>
  <p>Қазақ әдебиетінің көрнекті тұлғалары</p>
</header>
  
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<nav id="menu">
  <button onclick="location.href='index.html'">🏠 Басты бет</button>
  <button onclick="location.href='authors-filtre.html'">✍️ Авторлар</button>
  <button onclick="location.href='poemGame.html'">🎮 Қаламгер ойыны</button>
  <button onclick="location.href='contact.html'">📩 Байланыс</button>
  <button onclick="location.href='poems.html'">📝 Өлеңдер</button>
  <button onclick="location.href='shygarms.html'">📑 Шығармалар</button>
  <button onclick="location.href='add-poem.html'">➕ Өлең қосу</button>
</nav>

<!-- ФИЛЬТР -->
<div class="filter-section">
  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all', this)">Барлығы</button>
    <button class="filter-btn" onclick="setFilter('aqyn', this)">✍️ Ақындар</button>
    <button class="filter-btn" onclick="setFilter('jazushy', this)">📚 Жазушылар</button>
    <button class="filter-btn" onclick="setFilter('alash', this)">📜 Алаш зиялылары</button>
    <button class="filter-btn" onclick="setFilter('kompozitor', this)">🎵 Композиторлар</button>
  </div>
</div>

<!-- ІЗДЕУ -->
<div class="search-box">
  <input type="text" id="searchInput" placeholder="Автор іздеу..." oninput="applyFilters()">
</div>

<!-- ── FIREBASE-ТЕН ДИНАМИКАЛЫҚ АВТОРЛАР ── -->
<div class="cards-container" id="all-cards">
  <div class="loading-state" id="loading-state">
    <div class="loading-spinner"></div>
    <span>Авторлар жүктелуде...</span>
  </div>
  <div class="empty-msg" id="empty-msg" style="display:none;">Автор табылмады</div>
</div>

<footer>
  © 2026 Әдебиет ордасы | Қазақ әдеби порталы
</footer>

<script>
// ── ГЛОБАЛ КҮЙЛЕР ──
let activeFilter = 'all';
let firebaseLoaded = false;  // Firebase жүктелгенше фильтр іске қоспайды

const categoryLabels = {
  aqyn:       '✍️ Ақын',
  jazushy:    '📚 Жазушы',
  alash:      '📜 Алаш зиялысы',
  kompozitor: '🎵 Композитор'
};

// ── ФИЛЬТР БАТЫРМАСЫ ──
function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (firebaseLoaded) applyFilters();
}

// ── ІЗДЕУ + ФИЛЬТР БІРГЕ ──
function applyFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const cards  = document.querySelectorAll('#all-cards .card');
  let visible  = 0;

  cards.forEach(card => {
    const cat  = card.getAttribute('data-category') || '';
    const text = card.innerText.toLowerCase();

    const catMatch    = activeFilter === 'all' || cat === activeFilter;
    const searchMatch = search === '' || text.includes(search);

    if (catMatch && searchMatch) {
      card.classList.remove('hidden');
      visible++;
    } else {
      card.classList.add('hidden');
    }
  });

  document.getElementById('empty-msg').style.display = visible === 0 ? 'block' : 'none';
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, orderBy, query }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey:    "AIzaSyC_aLF4dK_m0jvkbSzhTWo3rsP7yx5uoXw",
  projectId: "adebiet-ordasy",
  appId:     "1:331787955330:web:a77853b5bffdb44bed989b"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const categoryLabels = {
  aqyn:       '✍️ Ақын',
  jazushy:    '📚 Жазушы',
  alash:      '📜 Алаш зиялысы',
  kompozitor: '🎵 Композитор'
};

async function loadAuthors() {
  const container = document.getElementById('all-cards');
  const loadingEl = document.getElementById('loading-state');
  const emptyEl   = document.getElementById('empty-msg');

  try {
    const q    = query(collection(db, "authors"), orderBy("addedAt", "desc"));
    const snap = await getDocs(q);

    // Жүктеу спиннерін жасыру
    loadingEl.style.display = 'none';

    if (snap.empty) {
      emptyEl.style.display = 'block';
      return;
    }

    snap.forEach(docSnap => {
      const author   = docSnap.data();
      const id       = docSnap.id;
      const category = author.category || 'aqyn';
      const catLabel = categoryLabels[category] || '';
      const catClass = `cat-${category}`;

      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('data-category', category);
      card.onclick = () => { location.href = `author-profile.html?id=${id}`; };

      card.innerHTML = `
        <div class="card-img-wrap">
          <img src="${author.photoUrl || 'images/logo.png'}" alt="${author.name || ''}"
               onerror="this.src='images/logo.png'">
          <span class="cat-label ${catClass}">${catLabel}</span>
        </div>
        <div class="card-body">
          <h2>${author.name || 'Белгісіз'}</h2>
          <p>${(author.biography || '').substring(0, 120)}...</p>
          <a href="author-profile.html?id=${id}">Толығырақ →</a>
        </div>
      `;

      container.appendChild(card);
    });

    // Firebase жүктелді — енді фильтрді қолдануға болады
    firebaseLoaded = true;
    applyFilters();

  } catch (e) {
    console.error("Firebase қатесі:", e);
    loadingEl.style.display = 'none';
    emptyEl.textContent = 'Деректерді жүктеу қатесі. Бетті қайта жүктеңіз.';
    emptyEl.style.display = 'block';
  }
}

loadAuthors();
</script>

<script>
function toggleMenu() {
  document.getElementById("menu").classList.toggle("show");
  document.getElementById("overlay").classList.toggle("show");
}
</script>

</body>
</html>
