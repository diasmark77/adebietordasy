<style>
:root {
  --bg:        #f5f0e8;
  --card-bg:   rgba(255,255,255,0.97);
  --brown:     #5c4033;
  --brown-mid: #8b5e3c;
  --gold:      #d4af37;
  --gold-dark: #b8962e;
  --text:      #2e2418;
  --muted:     #7a6a58;
  --border:    #e2dbd0;
  --shadow:    rgba(92,64,51,0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

header {
  background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url("images/kazakh-dalasy.jpg") center/cover no-repeat;
  color: white;
  text-align: center;
  padding: 60px 20px;
}
header h1 { margin: 0 0 6px; font-size: 2em; font-family: 'Merriweather', serif; }
header p  { margin: 0; opacity: 0.85; font-size: 15px; }

.menu-btn {
  position: fixed;
  top: 16px; left: 16px;
  z-index: 1000;
  background: var(--brown);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 20px;
  cursor: pointer;
}

.filter-section {
  text-align: center;
  padding: 32px 16px 0;
}
.filter-bar {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}
.filter-btn {
  padding: 9px 22px;
  border-radius: 30px;
  border: 2px solid var(--border);
  background: white;
  color: var(--brown);
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Nunito', sans-serif;
  letter-spacing: 0.2px;
}
.filter-btn:hover {
  border-color: var(--brown-mid);
  background: #fdf5e6;
}
.filter-btn.active {
  background: var(--brown);
  border-color: var(--brown);
  color: white;
  box-shadow: 0 4px 14px rgba(92,64,51,0.25);
}

.search-box {
  text-align: center;
  margin: 20px 0 32px;
}
.search-wrap {
  display: inline-flex;
  align-items: center;
  background: white;
  border: 2px solid var(--border);
  border-radius: 40px;
  padding: 4px 18px;
  width: 60%;
  max-width: 520px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-wrap:focus-within {
  border-color: var(--brown-mid);
  box-shadow: 0 0 0 4px rgba(139,94,60,0.1);
}
.search-wrap span { font-size: 18px; margin-right: 8px; opacity: 0.5; }
.search-wrap input {
  border: none;
  outline: none;
  font-size: 14px;
  font-family: 'Nunito', sans-serif;
  background: transparent;
  color: var(--text);
  width: 100%;
  padding: 8px 0;
}

.cards-container {
  display: flex;
  flex-wrap: wrap;
  gap: 22px;
  justify-content: center;
  padding: 0 24px 60px;
}

.card {
  background: var(--card-bg);
  border-radius: 16px;
  box-shadow: 0 6px 20px var(--shadow);
  width: 260px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  transition: transform 0.25s, box-shadow 0.25s;
  cursor: pointer;
  position: relative;
  text-decoration: none;
  color: inherit;
  overflow: hidden;
  border: 1px solid var(--border);
  padding-bottom: 20px;
}
.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 14px 32px rgba(92,64,51,0.22);
  border-color: #c8b89a;
}

.card-img-wrap {
  position: relative;
  width: 100%;
  height: 240px;
  background: #e8e0d4;
  overflow: hidden;
  flex-shrink: 0;
}
.card-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
  display: block;
  transition: transform 0.35s ease;
}
.card:hover .card-img-wrap img {
  transform: scale(1.05);
}
.card-img-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 55%, rgba(44,22,10,0.45) 100%);
  pointer-events: none;
}

.cat-label {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.4px;
  padding: 4px 10px;
  border-radius: 20px;
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 2;
  backdrop-filter: blur(4px);
}
.cat-aqyn       { background: rgba(237,232,251,0.93); color: #3C3489; }
.cat-jazushy    { background: rgba(230,241,251,0.93); color: #0C447C; }
.cat-alash      { background: rgba(250,238,218,0.93); color: #633806; }
.cat-kompozitor { background: rgba(225,245,238,0.93); color: #085041; }

.card-body {
  padding: 16px 16px 0;
  width: 100%;
}
.card h2 {
  font-family: 'Playfair Display', serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--brown);
  margin-bottom: 6px;
  line-height: 1.35;
}
.card p {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.65;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 12px;
}
.read-more {
  display: inline-block;
  color: #5c4033;
  font-weight: 700;
  font-size: 12.5px;
  letter-spacing: 0.2px;
  text-decoration: none;
  border-bottom: 1.5px solid transparent;
  transition: border-color 0.2s, color 0.2s;
}
.card:hover .read-more {

.loading-state {

footer {

<div id="migrate-panel">

<!-- ГЛОБАЛ JS -->
<script>
let activeFilter = 'all';
let dataLoaded = false;

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (dataLoaded) applyFilters();
}

function applyFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const cards  = document.querySelectorAll('#all-cards .card');
  let visible  = 0;

  cards.forEach(card => {
    const cat  = card.getAttribute('data-category') || '';
    const text = card.innerText.toLowerCase();
    const catMatch    = activeFilter === 'all' || cat === activeFilter;
    const searchMatch = search === '' || text.includes(search);

    if (catMatch && searchMatch) {
      card.classList.remove('hidden');
      visible++;
    } else {
      card.classList.add('hidden');
    }
  });

  document.getElementById('empty-msg').style.display = visible === 0 ? 'block' : 'none';
}

function toggleMenu() {
  document.getElementById('menu').classList.toggle('show');
  document.getElementById('overlay').classList.toggle('show');
}
</script>

<!-- АВТОРЛАР ЖҮКТЕУ (Supabase) -->
<script>
const SUPABASE_URL = "https://rehdrlbhglnhajwtgohr.supabase.co";
const SUPABASE_KEY = "sb_publishable_9-WTtRK7KHkr8dQ7x30Yew_Syacj2vB";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
window._sbClient = supabase;

const categoryLabels = {
  aqyn:       '✍️ Ақын',
  jazushy:    '📚 Жазушы',
  alash:      '📜 Алаш зиялысы',
  kompozitor: '🎵 Композитор'
};

async function loadAuthors() {
  const container = document.getElementById('all-cards');
  const loadingEl = document.getElementById('loading-state');
  const emptyEl   = document.getElementById('empty-msg');

  try {
    const { data: authors, error } = await supabase
      .from('authors')
      .select('*')
      .order('added_at', { ascending: false });

    if (error) throw error;

    loadingEl.style.display = 'none';

    if (!authors || authors.length === 0) {
      emptyEl.style.display = 'block';
      return;
    }

    authors.forEach(author => {
      const id       = author.id;
      const category = author.category || 'aqyn';
      const catLabel = categoryLabels[category] || '';
      const catClass = `cat-${category}`;

      const card = document.createElement('a');
      card.className = 'card';
      card.setAttribute('data-category', category);
      card.href = `author-profile.html?id=${id}`;

      card.innerHTML = `
        <div class="card-img-wrap">
          <img src="${author.photo_url || 'images/logo.png'}"
               alt="${author.name || ''}"
               onerror="this.src='images/logo.png'">
          <span class="cat-label ${catClass}">${catLabel}</span>
        </div>
        <div class="card-body">
          <h2>${author.name || 'Белгісіз'}</h2>
          <p>${(author.biography || '').substring(0, 120)}...</p>
          <span class="read-more">Толығырақ →</span>
        </div>
      `;

      container.appendChild(card);
    });

    dataLoaded = true;
    applyFilters();

  } catch (e) {
    console.error("Supabase қатесі:", e);
    loadingEl.style.display = 'none';
    emptyEl.textContent = 'Деректерді жүктеу қатесі: ' + e.message;
    emptyEl.style.display = 'block';
  }
}

loadAuthors();
</script>

<!-- МИГРАЦИЯ СКРИПТІ -->
<script>
function migrateLog(msg) {
  const log = document.getElementById('migrate-log');
  log.innerHTML += msg + '<br>';
  log.scrollTop = log.scrollHeight;
}

// camelCase → snake_case түрлендіру
function toSnakeCase(str) {
  return str.replace(/([A-Z])/g, '_$1').toLowerCase();
}

// Firebase Timestamp және басқа сериализацияланбайтын типтерді тазалайды
function cleanFirebaseData(data) {
  const clean = {};
  for (const [key, val] of Object.entries(data)) {
    const snakeKey = toSnakeCase(key);
    if (val === undefined || val === null) {
      clean[snakeKey] = null;
    } else if (typeof val?.toDate === 'function') {
      // Firestore Timestamp → ISO string
      clean[snakeKey] = val.toDate().toISOString();
    } else if (val instanceof Object && val.seconds !== undefined && val.nanoseconds !== undefined) {
      // Timestamp plain object түрі
      clean[snakeKey] = new Date(val.seconds * 1000).toISOString();
    } else if (Array.isArray(val)) {
      clean[snakeKey] = val.map(item =>
        item && typeof item === 'object' ? cleanFirebaseData(item) : item
      );
    } else if (typeof val === 'object') {
      clean[snakeKey] = cleanFirebaseData(val);
    } else {
      clean[snakeKey] = val;
    }
  }
  return clean;
}

async function runMigration() {
  const btn = document.getElementById('migrate-run');

  // Бетте бұрын жасалған supabase клиентін қолданамыз
  const sbClient = window._sbClient;

  btn.disabled = true;
  btn.textContent = '⏳ Жүктелуде...';
  document.getElementById('migrate-log').innerHTML = '';

  try {
    const { initializeApp, getApps } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js");
    const { getFirestore, collection, collectionGroup, getDocs } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");

    const _app = getApps().find(a => a.name === "migration")
      || initializeApp({
           apiKey:    "AIzaSyC_aLF4dK_m0jvkbSzhTWo3rsP7yx5uoXw",
           projectId: "adebiet-ordasy",
           appId:     "1:331787955330:web:a77853b5bffdb44bed989b"
         }, "migration");

    const _db = getFirestore(_app);

    const _cols = [
      "authors", "poem_requests",
      "poems", "requests", "shygarma_requests", "shygarmalar"
    ];

    migrateLog("🚀 Миграция басталды...");

    for (const col of _cols) {
      try {
        migrateLog(`⏳ ${col}: Firebase-тен жүктелуде...`);
        const snap = await getDocs(collection(_db, col));
        migrateLog(`📊 ${col}: ${snap.size} документ табылды`);

        if (snap.empty) {
          migrateLog(`⏭ ${col}: Firebase-те бос (0 документ)`);
          continue;
        }

        const rows = snap.docs.map(d => ({
          id: d.id,
          ...cleanFirebaseData(d.data())
        }));

        migrateLog(`📦 ${col}: Supabase-ке жазылуда...`);

        let success = 0;
        let hasError = false;

        for (let i = 0; i < rows.length; i += 500) {
          const chunk = rows.slice(i, i + 500);
          const { error } = await sbClient.from(col).upsert(chunk, { onConflict: 'id' });
          if (error) {
            migrateLog(`❌ ${col} Supabase қатесі: ${error.message} (code: ${error.code})`);
            hasError = true;
            break;
          }
          success += chunk.length;
        }

        if (!hasError) {
          migrateLog(`✅ ${col}: ${success} жазба сәтті көшірілді`);
        }

      } catch (e) {
        migrateLog(`❌ ${col} қате [${e.code || 'unknown'}]: ${e.message}`);
      }
    }

    // comments subcollection миграциясы
    try {
      migrateLog("⏳ comments: жүктелуде...");
      const msgSnap = await getDocs(collectionGroup(_db, "messages"));

      if (msgSnap.empty) {
        migrateLog("⏭ comments: бос, өткізілді");
      } else {
        const msgRows = msgSnap.docs.map(d => ({
          id:      d.id,
          page_id: d.ref.parent.parent.id,
          ...cleanFirebaseData(d.data())
        }));

        migrateLog(`📦 comments: ${msgRows.length} хабарлама табылды, жазылуда...`);

        let success = 0;
        let hasError = false;

        for (let i = 0; i < msgRows.length; i += 500) {
          const chunk = msgRows.slice(i, i + 500);
          const { error } = await sbClient.from("comments").upsert(chunk, { onConflict: 'id' });
          if (error) {
            migrateLog(`❌ comments (${i}–${i + chunk.length}): ${error.message}`);
            hasError = true;
            break;
          }
          success += chunk.length;
        }

        if (!hasError) {
          migrateLog(`✅ comments: ${success} хабарлама сәтті көшірілді`);
        }
      }
    } catch (e) {
      if (e.code === "permission-denied" || (e.message && e.message.includes("permissions"))) {
        migrateLog("⚠️ comments: Firebase рұқсат жоқ, өткізілді");
      } else {
        migrateLog(`❌ comments: ${e.message}`);
      }
    }

    migrateLog("🎉 Миграция аяқталды!");
    btn.textContent = "✅ Дайын";

  } catch (e) {
