<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ақындар | Әдебиет ордасы</title>
<meta name="description" content="Әдебиет ордасы сайтындағы қазақ ақындарының өмірбаяны, шығармашылығы және танымал өлеңдерімен танысыңыз.">
<meta name="keywords" content="әдебиет ордасы, қазақ ақындары, ақындар өмірбаяны, өлеңдер, поэзия">

<link rel="icon" href="images/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/menu.css">

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Open Sans', sans-serif;
  background: #f0ece3;
  color: #2e2418;
}

header {
  background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url("images/kazakh-dalasy.jpg") center/cover no-repeat;
  color: white;
  text-align: center;
  padding: 30px 20px;
}
header h1 {
  margin: 0 0 6px;
  font-size: 2.2em;
  font-family: 'Merriweather', serif;
  font-weight: 700;
  letter-spacing: 0.5px;
}
header p {
  margin: 0;
  opacity: 0.88;
  font-size: 15px;
}

/* ── SEARCH ── */
.search-box {
  text-align: center;
  margin: 24px 0 20px;
}
.search-box input {
  width: 60%;
  max-width: 580px;
  padding: 13px 18px;
  font-size: 15px;
  border-radius: 8px;
  border: 1px solid #d0c9be;
  font-family: 'Open Sans', sans-serif;
  background: white;
  color: #2e2418;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-box input:focus {
  outline: none;
  border-color: #8b5e3c;
  box-shadow: 0 0 0 3px rgba(139,94,60,0.12);
}
@media (max-width: 600px) {
  .search-box input { width: 92%; }
}

/* ── CARDS GRID ── */
.cards-container {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  padding: 0 28px 52px;
}
@media (max-width: 1100px) {
  .cards-container { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 760px) {
  .cards-container { grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 0 16px 40px; }
}
@media (max-width: 480px) {
  .cards-container { grid-template-columns: 1fr; gap: 12px; padding: 0 14px 32px; }
}

/* ── CARD ── */
.card {
  background: white;
  border-radius: 10px;
  border: 1px solid #e2dbd0;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  display: flex;
  flex-direction: column;
  position: relative;
  padding: 0;
  text-align: left;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 28px rgba(92,64,51,0.14);
  border-color: #c4b49a;
}

/* Portrait photo 2:3 */
.card-img-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 2 / 3;
  background: #e8e0d4;
  overflow: hidden;
  flex-shrink: 0;
}
.card-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
  display: block;
  transition: transform 0.35s ease;
}
.card:hover .card-img-wrap img {
  transform: scale(1.03);
}

/* ── CARD BODY ── */
.card-body {
  padding: 14px 15px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
}
.card-name {
  font-family: 'Merriweather', serif;
  font-size: 14px;
  font-weight: 700;
  color: #3a2410;
  margin: 0;
  line-height: 1.45;
}
.card-years {
  font-family: 'Open Sans', sans-serif;
  font-size: 11.5px;
  color: #a08060;
  margin: 0;
  font-weight: 600;
  letter-spacing: 0.2px;
}
.card-bio {
  font-family: 'Open Sans', sans-serif;
  font-size: 12.5px;
  color: #6a5a48;
  line-height: 1.65;
  margin: 0;
  flex: 1;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-link {
  display: inline-block;
  font-family: 'Open Sans', sans-serif;
  font-size: 12px;
  font-weight: 600;
  color: #8b5e3c;
  text-decoration: none;
  margin-top: 2px;
  padding: 5px 0 0;
  border-top: 1px solid #f0e8de;
}
.card-link:hover { color: #5c3a20; text-decoration: underline; }

/* hidden for search */
.card.hidden { display: none; }

.empty-msg {
  text-align: center;
  padding: 48px 20px;
  color: #9a8866;
  font-size: 15px;
  grid-column: 1 / -1;
  display: none;
  font-family: 'Open Sans', sans-serif;
}

footer {
  background: #5c4033;
  color: white;
  text-align: center;
  padding: 16px;
  margin-top: 8px;
  font-family: 'Open Sans', sans-serif;
  font-size: 14px;
}
</style>
</head>
<body>

<header>
  <h1>Ақындар</h1>
  <p>Қазақ поэзиясының көрнекті тұлғалары</p>
</header>

<button class="menu-btn" onclick="toggleMenu()">☰</button>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<nav id="menu">
  <button onclick="location.href='index.html'">🏠 Басты бет</button>
  <button onclick="location.href='authors-filtre.html'">✍️ Авторлар</button>
  <button onclick="location.href='poemGame.html'">🎮 Қаламгер ойыны</button>
  <button onclick="location.href='contact.html'">📩 Байланыс</button>
  <button onclick="location.href='poems.html'">📝 Өлеңдер</button>
  <button onclick="location.href='shygarms.html'">📑 Шығармалар</button>
</nav>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Ақын іздеу..." oninput="applySearch()">
</div>

<div class="cards-container" id="all-cards">

  <!-- ── СТАТИКАЛЫҚ КАРТОЧКАЛАР ── -->

  <!-- ── FIREBASE-ТЕН ДИНАМИКАЛЫҚ АВТОРЛАР ── -->
  <div id="dynamic-list" style="display: contents;"></div>

  <!-- Ештеңе табылмаса -->
  <div class="empty-msg" id="empty-msg">Ақын табылмады</div>

</div>

<footer>
  © 2026 Әдебиет ордасы | Қазақ әдеби порталы
</footer>

<script>
function applySearch() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const cards  = document.querySelectorAll('#all-cards .card');
  let visible  = 0;
  cards.forEach(card => {
    const match = search === '' || card.innerText.toLowerCase().includes(search);
    card.classList.toggle('hidden', !match);
    if (match) visible++;
  });
  document.getElementById('empty-msg').style.display = visible === 0 ? 'block' : 'none';
}

function toggleMenu() {
  document.getElementById("menu").classList.toggle("show");
  document.getElementById("overlay").classList.toggle("show");
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, orderBy, query }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_aLF4dK_m0jvkbSzhTWo3rsP7yx5uoXw",
  projectId: "adebiet-ordasy",
  appId: "1:331787955330:web:a77853b5bffdb44bed989b"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

async function loadAuthors() {
  const container = document.getElementById('dynamic-list');
  try {
    const q    = query(collection(db, "authors"), orderBy("addedAt", "desc"));
    const snap = await getDocs(q);
    snap.forEach(docSnap => {
      const author = docSnap.data();
      const id     = docSnap.id;
      const card   = document.createElement('div');
      card.className = 'card';
      card.onclick = () => { location.href = `author-profile.html?id=${id}`; };
      card.innerHTML = `
        <div class="card-img-wrap">
          <img src="${author.photoUrl || 'images/logo.png'}" alt="${author.name || ''}"
               onerror="this.src='images/logo.png'">
        </div>
        <div class="card-body">
          <p class="card-name">${author.name || 'Белгісіз'}</p>
          <p class="card-bio">${(author.biography || '').substring(0, 120)}...</p>
          <a class="card-link" href="author-profile.html?id=${id}">Толығырақ →</a>
        </div>
      `;
      container.appendChild(card);
    });
  } catch (e) {
    console.error("Firebase қатесі:", e);
  }
}

loadAuthors();
</script>

</body>
</html>
