<style>
:root {
  --bg:        #f5f0e8;
  --card-bg:   rgba(255,255,255,0.97);
  --brown:     #5c4033;
  --brown-mid: #8b5e3c;
  --gold:      #d4af37;
  --gold-dark: #b8962e;
  --text:      #2e2418;
  --muted:     #7a6a58;
  --border:    #e2dbd0;
  --shadow:    rgba(92,64,51,0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  /* Мазмұн төмендегі қалқыма тіл-бар астында қалып қоймас үшін */
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
}

header {
  background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url("images/kazakh-dalasy.jpg") center/cover no-repeat;
  color: white;
  text-align: center;
  padding: 60px 20px;
}
header h1 { margin: 0 0 6px; font-size: 2em; font-family: 'Merriweather', serif; }
header p  { margin: 0; opacity: 0.85; font-size: 15px; }

.filter-section {
  text-align: center;
  padding: 32px 16px 0;
}
.filter-bar {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}
.filter-btn {
  padding: 9px 22px;
  border-radius: 30px;
  border: 2px solid var(--border);
  background: white;
  color: var(--brown);
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Nunito', sans-serif;
  letter-spacing: 0.2px;
}
.filter-btn:hover {
  border-color: var(--brown-mid);
  background: #fdf5e6;
}
.filter-btn.active {
  background: var(--brown);
  border-color: var(--brown);
  color: white;
  box-shadow: 0 4px 14px rgba(92,64,51,0.25);
}

.search-box {
  text-align: center;
  margin: 20px 0 32px;
}
.search-wrap {
  display: inline-flex;
  align-items: center;
  background: white;
  border: 2px solid var(--border);
  border-radius: 40px;
  padding: 4px 18px;
  width: 60%;
  max-width: 520px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-wrap:focus-within {
  border-color: var(--brown-mid);
  box-shadow: 0 0 0 4px rgba(139,94,60,0.1);
}
.search-wrap span { font-size: 18px; margin-right: 8px; opacity: 0.5; }
.search-wrap input {
  border: none;
  outline: none;
  font-size: 14px;
  font-family: 'Nunito', sans-serif;
  background: transparent;
  color: var(--text);
  width: 100%;
  padding: 8px 0;
}

.cards-container {
  display: flex;
  flex-wrap: wrap;
  gap: 22px;
  justify-content: center;
  padding: 0 24px 60px;
}

.card {
  background: var(--card-bg);
  border-radius: 16px;
  box-shadow: 0 6px 20px var(--shadow);
  width: 260px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  transition: transform 0.25s, box-shadow 0.25s;
  cursor: pointer;
  position: relative;
  text-decoration: none;
  color: inherit;
  overflow: hidden;
  border: 1px solid var(--border);
  padding-bottom: 20px;
}
.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 14px 32px rgba(92,64,51,0.22);
  border-color: #c8b89a;
}

.card-img-wrap {
  position: relative;
  width: 100%;
  height: 240px;
  background: #e8e0d4;
  overflow: hidden;
  flex-shrink: 0;
}
.card-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
  display: block;
  transition: transform 0.35s ease;
}
.card:hover .card-img-wrap img {
  transform: scale(1.05);
}
.card-img-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 55%, rgba(44,22,10,0.45) 100%);
  pointer-events: none;
}

.cat-label {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.4px;
  padding: 4px 10px;
  border-radius: 20px;
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 2;
  backdrop-filter: blur(4px);
}
.cat-aqyn       { background: rgba(237,232,251,0.93); color: #3C3489; }
.cat-jazushy    { background: rgba(230,241,251,0.93); color: #0C447C; }
.cat-alash      { background: rgba(250,238,218,0.93); color: #633806; }
.cat-kompozitor { background: rgba(225,245,238,0.93); color: #085041; }

.card-body {
  padding: 16px 16px 0;
  width: 100%;
}
.card h2 {
  font-family: 'Playfair Display', serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--brown);
  margin-bottom: 6px;
  line-height: 1.35;
}
.card p {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.65;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 12px;
}
.read-more {
  display: inline-block;
  color: #5c4033;
  font-weight: 700;
  font-size: 12.5px;
  letter-spacing: 0.2px;
  text-decoration: none;
  border-bottom: 1.5px solid transparent;
  transition: border-color 0.2s, color 0.2s;
}
.card:hover .read-more {
  color: #3a2410;
  border-bottom-color: #5c4033;
}

.card.hidden { display: none !important; }

.empty-msg {
  text-align: center;
  padding: 50px 20px;
  color: var(--muted);
  font-size: 15px;
  display: none;
  width: 100%;
}

.loading-state {
  text-align: center;
  padding: 70px 20px;
  color: var(--brown-mid);
  font-size: 15px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.loading-spinner {
  width: 36px;
  height: 36px;
  border: 3px solid #e8ddd4;
  border-top-color: var(--brown-mid);
  border-radius: 50%;
  animation: spin 0.85s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

footer {
  background: var(--brown);
  color: rgba(255,255,255,0.85);
  text-align: center;
  padding: 18px 20px;
  font-size: 13px;
  letter-spacing: 0.3px;
}

@media (max-width: 600px) {
  .card { width: 90%; max-width: 340px; }
  .search-wrap { width: 88%; }
  .filter-btn { font-size: 12.5px; padding: 8px 16px; }
}

/* ═══════════════════════════════════════════════
   ТӨМЕНГІ МЕНЮ — iOS/Instagram стиліндегі tab bar
   (index.html беттегі стильмен бірдей)
   ═══════════════════════════════════════════════ */
nav.tabbar {
  all: unset !important;
  box-sizing: border-box !important;
  display: flex !important;
  flex-direction: row !important;
  position: fixed !important;
  top: auto !important;
  left: 10px !important;
  right: 10px !important;
  bottom: calc(10px + env(safe-area-inset-bottom)) !important;
  width: auto !important;
  height: auto !important;
  min-height: 0 !important;
  max-width: 520px !important;
  margin: 0 auto !important;
  transform: none !important;
  transition: none !important;
  align-items: stretch !important;
  justify-content: space-around !important;
  background: rgba(250, 247, 240, 0.92) !important;
  -webkit-backdrop-filter: saturate(180%) blur(20px) !important;
  backdrop-filter: saturate(180%) blur(20px) !important;
  border: 1px solid rgba(139, 94, 60, 0.14) !important;
  border-radius: 26px !important;
  box-shadow: 0 8px 28px rgba(44, 24, 16, 0.16) !important;
  padding: 8px 6px !important;
  z-index: 1000 !important;
}

.tabbar-indicator {
  position: absolute;
  top: 6px;
  height: 46px;
  border-radius: 20px;
  background: rgba(139, 94, 60, 0.13);
  box-shadow: inset 0 0 0 1px rgba(139, 94, 60, 0.16);
  transition: left 0.35s cubic-bezier(.34,1.56,.64,1),
              width 0.35s cubic-bezier(.34,1.56,.64,1),
              opacity 0.2s ease;
  pointer-events: none;
  opacity: 0;
}

.tabbar a {
  flex: 1 1 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  text-decoration: none;
  color: #9c8874;
  padding: 9px 2px 7px;
  min-height: 46px;
  border-radius: 20px;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.25s ease, transform 0.15s ease;
  position: relative;
  z-index: 1;
}

.tabbar a svg {
  width: 25px;
  height: 25px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
}

.tabbar a span {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.1px;
  line-height: 1.1;
  white-space: nowrap;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.tabbar a:active {
  transform: scale(0.92);
}

.tabbar a.active {
  color: #6e472c;
}

.tabbar a.active svg {
  transform: translateY(-1px) scale(1.08);
}

.tabbar-indicator.dragging {
  transform: scale(1.05);
  box-shadow: inset 0 0 0 1.5px rgba(139, 94, 60, 0.35), 0 6px 16px rgba(139, 94, 60, 0.28);
}

.tabbar a.active {
  cursor: grab;
  touch-action: none;
}

.tabbar a.active:active {
  cursor: grabbing;
}

.tabbar a.drag-hover {
  color: #6e472c;
}

.tabbar a.drag-hover svg {
  transform: translateY(-1px) scale(1.12);
}

@media (max-width: 380px) {
  .tabbar a span { font-size: 9.5px; }
  .tabbar a svg { width: 21px; height: 21px; }
}
</style>

<!-- ГЛОБАЛ JS (фильтр/іздеу) -->
<script>
let activeFilter = 'all';
let dataLoaded = false;

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (dataLoaded) applyFilters();
}

function applyFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const cards  = document.querySelectorAll('#all-cards .card');
  let visible  = 0;

  cards.forEach(card => {
    const cat  = card.getAttribute('data-category') || '';
    const text = card.innerText.toLowerCase();
    const catMatch    = activeFilter === 'all' || cat === activeFilter;
    const searchMatch = search === '' || text.includes(search);

    if (catMatch && searchMatch) {
      card.classList.remove('hidden');
      visible++;
    } else {
      card.classList.add('hidden');
    }
  });

  document.getElementById('empty-msg').style.display = visible === 0 ? 'block' : 'none';
}
</script>

<script>
const SUPABASE_URL = "https://rehdrlbhglnhajwtgohr.supabase.co";
const SUPABASE_KEY = "sb_publishable_9-WTtRK7KHkr8dQ7x30Yew_Syacj2vB";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const categoryLabels = {
  aqyn:       '✍️ Ақын',
  jazushy:    '📚 Жазушы',
  alash:      '📜 Алаш зиялысы',
  kompozitor: '🎵 Композитор'
};

async function loadAuthors() {
  const container = document.getElementById('all-cards');
  const loadingEl = document.getElementById('loading-state');
  const emptyEl   = document.getElementById('empty-msg');

  try {
    const { data: authors, error } = await supabase
      .from('authors')
      .select('*')
      .order('added_at', { ascending: false });

    if (error) throw error;

    loadingEl.style.display = 'none';

    if (!authors || authors.length === 0) {
      emptyEl.style.display = 'block';
      return;
    }

    authors.forEach(author => {
      const id       = author.id;
      const category = author.category || 'aqyn';
      const catLabel = categoryLabels[category] || '';
      const catClass = `cat-${category}`;

      const card = document.createElement('a');
      card.className = 'card';
      card.setAttribute('data-category', category);
      card.href = `/author/${id}`;

      card.innerHTML = `
        <div class="card-img-wrap">
          <img src="${author.photo_url || 'images/logo.png'}"
               alt="${author.name || ''}"
               onerror="this.src='images/logo.png'">
          <span class="cat-label ${catClass}">${catLabel}</span>
        </div>
        <div class="card-body">
          <h2>${author.name || 'Белгісіз'}</h2>
          <p>${(author.biography || '').substring(0, 120)}...</p>
          <span class="read-more">Толығырақ →</span>
        </div>
      `;

      container.appendChild(card);
    });

    dataLoaded = true;
    applyFilters();

  } catch (e) {
    console.error("Supabase қатесі:", e);
    loadingEl.style.display = 'none';
    emptyEl.textContent = 'Деректерді жүктеу қатесі: ' + e.message;
    emptyEl.style.display = 'block';
  }
}

loadAuthors();
</script>

<!-- ТІЛ-БАР инициализациясы (index.html беттегімен бірдей) -->
<script>
(function initTabbar() {
  const tabbar = document.getElementById('tabbar');
  const indicator = document.getElementById('tabbarIndicator');
  const tabs = Array.from(document.querySelectorAll('.tabbar a'));
  const current = location.pathname.split('/').pop() || 'index.html';

  tabs.forEach(a => a.classList.toggle('active', a.dataset.page === current));

  function getTabBox(tab) {
    const barRect = tabbar.getBoundingClientRect();
    const tabRect = tab.getBoundingClientRect();
    const pad = 6;
    return {
      left: tabRect.left - barRect.left + pad,
      width: tabRect.width - pad * 2
    };
  }

  function movePillTo(tab, animate) {
    if (!tab) { indicator.style.opacity = '0'; return; }
    const box = getTabBox(tab);
    indicator.style.transition = animate
      ? 'left 0.35s cubic-bezier(.34,1.56,.64,1), width 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.2s ease'
      : 'opacity 0.2s ease';
    indicator.style.left = box.left + 'px';
    indicator.style.width = box.width + 'px';
    indicator.style.opacity = '1';
  }

  function positionPill() {
    const activeTab = tabs.find(a => a.classList.contains('active'));
    movePillTo(activeTab, false);
  }

  positionPill();
  window.addEventListener('load', positionPill);
  window.addEventListener('resize', positionPill);

  let ignoreNextClick = false;

  function goToTab(tab) {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    movePillTo(tab, true);
    const href = tab.getAttribute('href');
    setTimeout(() => { location.href = href; }, 260);
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', function (e) {
      if (ignoreNextClick) { ignoreNextClick = false; e.preventDefault(); return; }
      if (tab.classList.contains('active')) return;
      e.preventDefault();
      goToTab(tab);
    });
  });

  let isDragging = false;
  let dragMoved = false;
  let activePointerId = null;

  tabbar.style.userSelect = 'none';
  tabbar.style.webkitUserSelect = 'none';

  tabbar.addEventListener('pointerdown', (e) => {
    const tab = e.target.closest('a');
    if (!tab || !tab.classList.contains('active')) return;
    isDragging = true;
    dragMoved = false;
    activePointerId = e.pointerId;
    try { tabbar.setPointerCapture(e.pointerId); } catch (err) {}
    indicator.classList.add('dragging');
    document.body.style.cursor = 'grabbing';
  });

  tabbar.addEventListener('pointermove', (e) => {
    if (!isDragging || e.pointerId !== activePointerId) return;
    dragMoved = true;
    e.preventDefault();

    const x = e.clientX;
    let targetTab = null;
    for (const tab of tabs) {
      const r = tab.getBoundingClientRect();
      if (x >= r.left && x <= r.right) { targetTab = tab; break; }
    }

    tabs.forEach(t => t.classList.remove('drag-hover'));
    if (targetTab) {
      targetTab.classList.add('drag-hover');
      indicator.style.transition = 'left 0.12s ease, width 0.12s ease';
      const box = getTabBox(targetTab);
      indicator.style.left = box.left + 'px';
      indicator.style.width = box.width + 'px';
    }
  }, { passive: false });

  function endDrag(e) {
    if (!isDragging) return;
    isDragging = false;
    document.body.style.cursor = '';
    indicator.classList.remove('dragging');

    const dropTab = tabs.find(t => t.classList.contains('drag-hover'));
    tabs.forEach(t => t.classList.remove('drag-hover'));

    if (dropTab && dragMoved) {
      if (dropTab.classList.contains('active')) {
        movePillTo(dropTab, true);
      } else {
        ignoreNextClick = true;
        setTimeout(() => { ignoreNextClick = false; }, 500);
        goToTab(dropTab);
      }
    } else {
      const activeTab = tabs.find(t => t.classList.contains('active'));
      movePillTo(activeTab, true);
    }
    dragMoved = false;
  }

  tabbar.addEventListener('pointerup', endDrag);
  tabbar.addEventListener('pointercancel', endDrag);
})();
</script>

</body>
</html>
