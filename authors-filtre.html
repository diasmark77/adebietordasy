<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Авторлар | Әдебиет ордасы</title>
<meta name="description" content="Әдебиет ордасы сайтындағы қазақ авторларының өмірбаяны, шығармашылығы және танымал шығармаларымен танысыңыз.">

<link rel="icon" href="images/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/menu.css">

<style>
:root {
  --bg:        #f5f0e8;
  --card-bg:   rgba(255,255,255,0.97);
  --brown:     #5c4033;
  --brown-mid: #8b5e3c;
  --gold:      #d4af37;
  --gold-dark: #b8962e;
  --text:      #2e2418;
  --muted:     #7a6a58;
  --border:    #e2dbd0;
  --shadow:    rgba(92,64,51,0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── HEADER ── */
header {
  position: relative;
  background:
    linear-gradient(160deg, rgba(44,22,10,0.82) 0%, rgba(92,64,51,0.70) 100%),
    url("images/kazakh-dalasy.jpg") center/cover no-repeat;
  color: white;
  text-align: center;
  padding: 56px 20px 44px;
  overflow: hidden;
}
header::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 48px;
  background: var(--bg);
  clip-path: ellipse(55% 100% at 50% 100%);
}
header h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 5vw, 3.2rem);
  font-weight: 900;
  letter-spacing: 1px;
  margin-bottom: 8px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.4);
}
header p {
  opacity: 0.85;
  font-size: 15px;
  font-weight: 400;
  letter-spacing: 0.5px;
}

/* ── MENU BUTTON (from menu.css) ── */
.menu-btn {
  position: fixed;
  top: 16px; left: 16px;
  z-index: 1000;
  background: var(--brown);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 20px;
  cursor: pointer;
}

/* ── FILTER BAR ── */
.filter-section {
  text-align: center;
  padding: 32px 16px 0;
}
.filter-bar {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}
.filter-btn {
  padding: 9px 22px;
  border-radius: 30px;
  border: 2px solid var(--border);
  background: white;
  color: var(--brown);
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Nunito', sans-serif;
  letter-spacing: 0.2px;
}
.filter-btn:hover {
  border-color: var(--brown-mid);
  background: #fdf5e6;
}
.filter-btn.active {
  background: var(--brown);
  border-color: var(--brown);
  color: white;
  box-shadow: 0 4px 14px rgba(92,64,51,0.25);
}

/* ── SEARCH ── */
.search-box {
  text-align: center;
  margin: 20px 0 32px;
}
.search-wrap {
  display: inline-flex;
  align-items: center;
  background: white;
  border: 2px solid var(--border);
  border-radius: 40px;
  padding: 4px 18px;
  width: 60%;
  max-width: 520px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-wrap:focus-within {
  border-color: var(--brown-mid);
  box-shadow: 0 0 0 4px rgba(139,94,60,0.1);
}
.search-wrap span { font-size: 18px; margin-right: 8px; opacity: 0.5; }
.search-wrap input {
  border: none;
  outline: none;
  font-size: 14px;
  font-family: 'Nunito', sans-serif;
  background: transparent;
  color: var(--text);
  width: 100%;
  padding: 8px 0;
}

/* ── CARDS CONTAINER ── */
.cards-container {
  display: flex;
  flex-wrap: wrap;
  gap: 22px;
  justify-content: center;
  padding: 0 24px 60px;
}

/* ── CARD (full <a> tag) ── */
.card {
  background: var(--card-bg);
  border-radius: 16px;
  box-shadow: 0 6px 20px var(--shadow);
  width: 260px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  transition: transform 0.25s, box-shadow 0.25s;
  cursor: pointer;
  position: relative;
  text-decoration: none;
  color: inherit;
  overflow: hidden;
  border: 1px solid var(--border);
  padding-bottom: 20px;
}
.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 14px 32px rgba(92,64,51,0.22);
  border-color: #c8b89a;
}

/* ── PHOTO AREA ── */
.card-img-wrap {
  position: relative;
  width: 100%;
  height: 240px;
  background: #e8e0d4;
  overflow: hidden;
  flex-shrink: 0;
}
.card-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
  display: block;
  transition: transform 0.35s ease;
}
.card:hover .card-img-wrap img {
  transform: scale(1.05);
}

/* Gold shimmer overlay on hover */
.card-img-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 55%, rgba(44,22,10,0.45) 100%);
  pointer-events: none;
}

/* ── CATEGORY LABEL ── */
.cat-label {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.4px;
  padding: 4px 10px;
  border-radius: 20px;
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 2;
  backdrop-filter: blur(4px);
}
.cat-aqyn       { background: rgba(237,232,251,0.93); color: #3C3489; }
.cat-jazushy    { background: rgba(230,241,251,0.93); color: #0C447C; }
.cat-alash      { background: rgba(250,238,218,0.93); color: #633806; }
.cat-kompozitor { background: rgba(225,245,238,0.93); color: #085041; }

/* ── CARD BODY ── */
.card-body {
  padding: 16px 16px 0;
  width: 100%;
}
.card h2 {
  font-family: 'Playfair Display', serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--brown);
  margin-bottom: 6px;
  line-height: 1.35;
}
.card p {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.65;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 12px;
}
.read-more {
  display: inline-block;
  color: var(--gold-dark);
  font-weight: 700;
  font-size: 12.5px;
  letter-spacing: 0.2px;
  text-decoration: none;
  border-bottom: 1.5px solid transparent;
  transition: border-color 0.2s, color 0.2s;
}
.card:hover .read-more {
  color: var(--gold);
  border-bottom-color: var(--gold);
}

/* ── HIDDEN / EMPTY / LOADING ── */
.card.hidden { display: none !important; }

.empty-msg {
  text-align: center;
  padding: 50px 20px;
  color: var(--muted);
  font-size: 15px;
  display: none;
  width: 100%;
}

.loading-state {
  text-align: center;
  padding: 70px 20px;
  color: var(--brown-mid);
  font-size: 15px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.loading-spinner {
  width: 36px;
  height: 36px;
  border: 3px solid #e8ddd4;
  border-top-color: var(--brown-mid);
  border-radius: 50%;
  animation: spin 0.85s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── FOOTER ── */
footer {
  background: var(--brown);
  color: rgba(255,255,255,0.85);
  text-align: center;
  padding: 18px 20px;
  font-size: 13px;
  letter-spacing: 0.3px;
}

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .card { width: 90%; max-width: 340px; }
  .search-wrap { width: 88%; }
  .filter-btn { font-size: 12.5px; padding: 8px 16px; }
}
</style>
</head>
<body>

<header>
  <h1>Авторлар</h1>
  <p>Қазақ әдебиетінің көрнекті тұлғалары</p>
</header>

<button class="menu-btn" onclick="toggleMenu()">☰</button>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<nav id="menu">
  <button onclick="location.href='index.html'">🏠 Басты бет</button>
  <button onclick="location.href='authors-filtre.html'">✍️ Авторлар</button>
  <button onclick="location.href='poemGame.html'">🎮 Қаламгер ойыны</button>
  <button onclick="location.href='contact.html'">📩 Байланыс</button>
  <button onclick="location.href='poems.html'">📝 Өлеңдер</button>
  <button onclick="location.href='shygarms.html'">📑 Шығармалар</button>
  <button onclick="location.href='add-poem.html'">➕ Өлең қосу</button>
</nav>

<!-- ФИЛЬТР -->
<div class="filter-section">
  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all', this)">Барлығы</button>
    <button class="filter-btn" onclick="setFilter('aqyn', this)">✍️ Ақындар</button>
    <button class="filter-btn" onclick="setFilter('jazushy', this)">📚 Жазушылар</button>
    <button class="filter-btn" onclick="setFilter('alash', this)">📜 Алаш зиялылары</button>
    <button class="filter-btn" onclick="setFilter('kompozitor', this)">🎵 Композиторлар</button>
  </div>
</div>

<!-- ІЗДЕУ -->
<div class="search-box">
  <div class="search-wrap">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="Автор іздеу..." oninput="applyFilters()">
  </div>
</div>

<!-- КАРТОЧКАЛАР -->
<div class="cards-container" id="all-cards">
  <div class="loading-state" id="loading-state">
    <div class="loading-spinner"></div>
    <span>Авторлар жүктелуде...</span>
  </div>
  <div class="empty-msg" id="empty-msg">Автор табылмады</div>
</div>

<footer>
  © 2026 Әдебиет ордасы | Қазақ әдеби порталы
</footer>

<!-- ── ГЛОБАЛ JS ── -->
<script>
let activeFilter = 'all';
let firebaseLoaded = false;

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (firebaseLoaded) applyFilters();
}

function applyFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const cards  = document.querySelectorAll('#all-cards .card');
  let visible  = 0;

  cards.forEach(card => {
    const cat  = card.getAttribute('data-category') || '';
    const text = card.innerText.toLowerCase();
    const catMatch    = activeFilter === 'all' || cat === activeFilter;
    const searchMatch = search === '' || text.includes(search);

    if (catMatch && searchMatch) {
      card.classList.remove('hidden');
      visible++;
    } else {
      card.classList.add('hidden');
    }
  });

  document.getElementById('empty-msg').style.display = visible === 0 ? 'block' : 'none';
}

function toggleMenu() {
  document.getElementById('menu').classList.toggle('show');
  document.getElementById('overlay').classList.toggle('show');
}
</script>

<!-- ── FIREBASE ── -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, orderBy, query }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey:    "AIzaSyC_aLF4dK_m0jvkbSzhTWo3rsP7yx5uoXw",
  projectId: "adebiet-ordasy",
  appId:     "1:331787955330:web:a77853b5bffdb44bed989b"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const categoryLabels = {
  aqyn:       '✍️ Ақын',
  jazushy:    '📚 Жазушы',
  alash:      '📜 Алаш зиялысы',
  kompozitor: '🎵 Композитор'
};

async function loadAuthors() {
  const container = document.getElementById('all-cards');
  const loadingEl = document.getElementById('loading-state');
  const emptyEl   = document.getElementById('empty-msg');

  try {
    const q    = query(collection(db, "authors"), orderBy("addedAt", "desc"));
    const snap = await getDocs(q);

    loadingEl.style.display = 'none';

    if (snap.empty) {
      emptyEl.style.display = 'block';
      return;
    }

    snap.forEach(docSnap => {
      const author   = docSnap.data();
      const id       = docSnap.id;
      const category = author.category || 'aqyn';
      const catLabel = categoryLabels[category] || '';
      const catClass = `cat-${category}`;

      const card = document.createElement('a');
      card.className = 'card';
      card.setAttribute('data-category', category);
      card.href = `author-profile.html?id=${id}`;

      card.innerHTML = `
        <div class="card-img-wrap">
          <img src="${author.photoUrl || 'images/logo.png'}"
               alt="${author.name || ''}"
               onerror="this.src='images/logo.png'">
          <span class="cat-label ${catClass}">${catLabel}</span>
        </div>
        <div class="card-body">
          <h2>${author.name || 'Белгісіз'}</h2>
          <p>${(author.biography || '').substring(0, 120)}...</p>
          <span class="read-more">Толығырақ →</span>
        </div>
      `;

      container.appendChild(card);
    });

    firebaseLoaded = true;
    applyFilters();

  } catch (e) {
    console.error("Firebase қатесі:", e);
    loadingEl.style.display = 'none';
    emptyEl.textContent = 'Деректерді жүктеу қатесі. Бетті қайта жүктеңіз.';
    emptyEl.style.display = 'block';
  }
}

loadAuthors();
</script>

</body>
</html>
