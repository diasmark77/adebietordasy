<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тіркелу – Әдебиет ордасы</title>
<style>
* {box-sizing:border-box;}
body {
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('kazakh-dalasy.jpg') center/cover no-repeat;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.container {
  background: rgba(30,15,0,0.85);
  padding:40px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.7);
  width: 90%;
  max-width:400px;
  text-align:center;
}
.container h2 { color:#ffa500; margin-bottom:20px; }
.container input { width:90%; padding:12px; margin:10px 0; border:none; border-radius:8px; }
.container button { width:95%; padding:12px; margin-top:10px; background:#b85c00; color:white; border:none; border-radius:8px; font-weight:bold; font-size:16px; cursor:pointer; transition:0.3s; }
.container button:hover { background:#ffa500; color:#000; }
</style>
</head>
<body>

<div class="container">
  <h2>Әдебиет ордасы</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Құпиясөз">
  <button id="signupBtn">Тіркелу</button>
</div>

<script type="module">
import { auth, db } from './main.js';
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
import { doc, setDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

document.getElementById("signupBtn").onclick = async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if(!email || !password){ alert("Барлық өрістерді толтырыңыз!"); return; }

  try {
    const user = await createUserWithEmailAndPassword(auth, email, password);
    await setDoc(doc(db, "users", user.user.uid), {
      email: email,
      role: "user"
    });
    alert("✅ Сәтті тіркелдіңіз!");
    window.location.href = "login.html";
  } catch(err) {
    alert("❌ Қате! Қайталап көріңіз.");
    console.error(err);
  }
};
</script>

</body>
</html>
