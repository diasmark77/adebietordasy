<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Әдебиет ордасы</title>

<style>
* {box-sizing:border-box;}
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),url("kazakh-dalasy.jpg") center/cover no-repeat;
  color:white;
  overflow:hidden; /* астыға сырғыту болмайды */
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.hero-title {font-size:56px;margin:10px 0;font-family:"Georgia", serif;letter-spacing:2px;text-align:center;}
.hero-subtitle {font-size:22px;opacity:0.9;margin-bottom:30px;text-align:center;}
.hero-btn {padding:15px 45px;background:#d4af37;color:#000;text-decoration:none;font-size:18px;border-radius:10px;font-weight:bold;transition:0.3s;box-shadow:0 5px 15px rgba(0,0,0,0.4);}
.hero-btn:hover {background:#b8962e;transform:translateY(-2px);}

/* Account Icon */
.account-icon {
  position:absolute;
  top:15px;
  left:15px;
  width:55px; /* үлкейтілді */
  height:55px;
  border-radius:50%;
  background:#ffa500;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:28px;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,0.5);
}

@media(max-width:600px){
  .hero-title{font-size:36px;}
  .hero-subtitle{font-size:18px;}
  .hero-btn{padding:12px 30px;font-size:16px;}
  .account-icon{width:50px;height:50px;font-size:26px;}
}
</style>
</head>

<body>

<div class="account-icon" id="accountIcon">👤</div>

<h1 class="hero-title">Әдебиет ордасы</h1>
<p class="hero-subtitle">Қазақ руханиятының әдеби ордасы</p>
<a href="menu.html" class="hero-btn">Бастау</a>

<script>
// Аккаунт белгісі login бетіне бағыттайды
document.getElementById("accountIcon").addEventListener("click", ()=>{
  location.href = 'login.html';
});
</script>

</body>
</html>
