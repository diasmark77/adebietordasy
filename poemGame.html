<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Қаламгер ойыны | Әдебиет ордасы</title>

<link rel="icon" href="images/logo.png" type="image/png">
<link rel="stylesheet" href="css/menu.css">
  
<style>
* {box-sizing:border-box;}
body {margin:0;font-family:Arial,sans-serif;background:#f4f1ea;color:#333;}

header {
  background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url("images/kazakh-dalasy.jpg") center/cover no-repeat;
  color:white;
  text-align:center;
  padding:25px;
}

/* MENU BUTTON */
.menu-btn{
background:#8b5e3c;
color:white;
border:none;
padding:12px 18px;
font-size:18px;
width:100%;
cursor:pointer;
}

/* NAVIGATION */
nav {
  display:none;
  flex-direction:column;
  background:#8b5e3c;
}
nav button {
  background:none;
  border:none;
  color:white;
  padding:14px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
  border-top:1px solid rgba(255,255,255,0.2);
}
nav button:hover {background:#6e472c;}
nav.show{display:flex;}

/* CONTENT */
section {padding:20px;max-width:800px;margin:auto;}
textarea {width:100%;padding:10px;font-size:16px;border-radius:5px;border:1px solid #ccc;margin-top:10px;}
button.action-btn {margin-top:10px;padding:10px 20px;font-size:16px;border:none;background:#8b5e3c;color:white;border-radius:5px;cursor:pointer;}
button.action-btn:hover {background:#6e472c;}
#result {margin-top:15px;border:1px solid #ccc;padding:10px;white-space: pre-line;background:white;border-radius:5px;}
h2 {color:#5c4033;}
footer {background:#5c4033;color:white;text-align:center;padding:15px;margin-top:30px;}

@media(max-width:800px){
  .menu-btn{display:block;}
  nav{display:none;}
  nav.show{display:flex;}
}
</style>
</head>
<body>

<header>
<h1>Қаламгер ойыны</h1>
<p>Өлеңіңді жалғастыр, шығармашылығыңды дамыт!</p>
</header>

<button class="menu-btn" onclick="toggleMenu()">☰</button>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<nav id="menu">

<button onclick="location.href='index.html'">🏠 Басты бет</button>

<button onclick="location.href='alash.html'">📜 Алаш зиялылары</button>

<button onclick="location.href='writers.html'">📚 Қазақ жазушылары</button>

<button onclick="location.href='poets.html'">✍️ Ақындар</button>

<button onclick="location.href='poemGame.html'">🎮 Қаламгер ойыны</button>

<button onclick="location.href='contact.html'">📩 Байланыс</button>

<button onclick="location.href='poems.html'">📝 Өлеңдер</button>

<button onclick="location.href='shygarms.html'">📑 Шығармалар</button>

</nav>
  
<section>
<h2>Өлең ойыны</h2>
<p id="poemLine"></p>
<textarea id="userInput" placeholder="Өлеңіңді жалғастыр"></textarea>
<br>
<button class="action-btn" onclick="nextLine()">Келесі жол</button>
<div id="result"></div>
</section>

<footer>
© 2026 Әдебиет ордасы | Қазақ әдеби порталы
</footer>

<script>
// MENU TOGGLE
function toggleMenu(){
document.getElementById("menu").classList.toggle("show");
}

// Өлең жолдары
const poems = [
  "Абай: Көзімнің қарасы ", 
  "Абай: Бітпейді іштегі",
  "Мұқағали: Қазақтың данасы,",
  "Диас: Бар демес сендей бір,",
  "Мұқағали:Найзағай шаншып өткенде,",
  "Мұқағали:Гүл тере барсаң бөктерге,",
  "Мұқағали:Нұр жауып тұрған көктемде,",
  "Диас:Самал соқса би билемес ырғалмай,",
  "Диас:Ақ қайыңдар сауық кешін құрғандай.",
  "Диас:Ақ қалпақты Алатаудың басынан,",
  "Диас:Қонаев та қолын бұлғап тұрғандай."
];
let currentLine = 0;

function nextLine(){
  const userText = document.getElementById('userInput').value;
  if(userText.trim()===""){ alert("Өлең жолын жаз!"); return; }
  const resultDiv = document.getElementById('result');
  resultDiv.textContent += poems[currentLine] + " " + userText + "\n";
  document.getElementById('userInput').value="";
  currentLine++; 
  if(currentLine>=poems.length){
    document.getElementById('poemLine').textContent="Барлық жолдар аяқталды!";
    return;
  }
  document.getElementById('poemLine').textContent=poems[currentLine];
}

// Бастапқы өлең жолын көрсету
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('poemLine').textContent=poems[0];
});



function toggleMenu(){
document.getElementById("menu").classList.toggle("show");
document.getElementById("overlay").classList.toggle("show");
}

</script>
  

</body>
</html>
