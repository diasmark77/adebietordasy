<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>Автор профилі | Әдебиет ордасы</title>
    <link rel="stylesheet" href="css/menu.css">
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f1ea; color: #333; }
        header { text-align: center; padding: 40px 20px; background: #5c4033; color: white; }
        .author-img { 
            width: 100%; max-width: 400px; height: auto; 
            border-radius: 15px; margin: 20px 0; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.3); 
            border: 4px solid white;
        }
        .container { max-width: 800px; margin: -30px auto 20px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); position: relative; }
        h1#author-name { margin: 10px 0; font-size: 2.2rem; }
        #author-bio { font-size: 1.1rem; line-height: 1.8; color: #444; }
        .work-section { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; }
        .back-btn { display: inline-block; margin-top: 20px; padding: 12px 24px; background: #d4af37; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; }
        .back-btn:hover { background: #b8962d; transform: scale(1.05); }
        
        /* Пікірлер стилі */
        .comments-section { max-width: 800px; margin: 40px auto; padding: 20px; background: white; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .comments-title { color: #5c4033; border-bottom: 2px solid #d4af37; padding-bottom: 10px; }
        #comment-input { width: 100%; min-height: 100px; border-radius: 10px; border: 1px solid #ddd; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        .auth-btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        #login-btn { background: #4285f4; color: white; }
           pre {
         white-space: pre-wrap; 
         font-family: 'Times New Roman', serif; 
         background: #fafafa; 
         padding: 20px; 
        border-radius: 10px; 
        border-left: 5px solid #d4af37; 
        font-size: 1.1rem;
       line-height: 1.6;
}
    </style>
</head>
<body>

<header>
    <img id="author-photo" src="images/logo.png" alt="Автор суреті" class="author-img">
    <h1 id="author-name">Жүктелуде...</h1>
</header>

<div class="container">
    <p id="author-bio"></p>
    <div id="author-work" class="work-section"></div>

<div class="card">
    <h2>Шығармадан үзінді</h2>
    <pre id="author-work">Жүктелуде...</pre>
</div>
    
    <button onclick="searchAuthorPoems()" class="back-btn">
        🔍 Осы автордың барлық шығармалары
    </button>
</div>

<button class="menu-btn" onclick="toggleMenu()">☰</button>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<nav id="menu">
    <button onclick="location.href='index.html'">🏠 Басты бет</button>
    <button onclick="location.href='alash.html'">📜 Алаш зиялылары</button>
    <button onclick="location.href='writers.html'">📚 Қазақ жазушылары</button>
    <button onclick="location.href='poets.html'">✍️ Ақындар</button>
    <button onclick="location.href='poems.html'">📝 Өлеңдер</button>
</nav>

<!-- Пікірлер бөлімі -->
<section class="comments-section">
    <h2 class="comments-title">💬 Пікірлер</h2>
    <div id="comments-container">
        <!-- Бұл жерге comments.js пікірлерді шығарады -->
    </div>
</section>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Firebase конфигурациясы
    const firebaseConfig = {
        apiKey: "AIzaSyC_aLF4dK_m0jvkbSzhTWo3rsP7yx5uoXw",
        authDomain: "adebiet-ordasy.firebaseapp.com",
        projectId: "adebiet-ordasy",
        storageBucket: "adebiet-ordasy.appspot.com",
        messagingSenderId: "776364024545",
        appId: "1:331787955330:web:a77853b5bffdb44bed989b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    async function loadAuthorData() {
        if (!id) {
            document.getElementById('author-name').innerText = "ID табылмады";
            return;
        }

        try {
            const docRef = doc(db, "published_content", id);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                
                // 1. Аты мен Биографиясы
                document.getElementById('author-name').innerText = data.name || "Аты жазылмаған";
                document.getElementById('author-bio').innerText = data.description || "Мәлімет жоқ";
                
                // 2. СУРЕТТІ ШЫҒАРУ (ID-ді тексер: author-photo)
                const photoImg = document.getElementById('author-photo');
                if (data.photoUrl) {
                    photoImg.src = data.photoUrl;
                }

                // 3. ӨЛЕҢДІ/ҮЗІНДІНІ ШЫҒАРУ (ID: author-work)
                const workBox = document.getElementById('author-work');
                if (data.work) {
                    workBox.innerText = data.work;
                } else {
                    // Егер өлең жоқ болса, бұл бөлімді жасырамыз
                    workBox.parentElement.style.display = 'none';
                }

            } else {
                document.getElementById('author-name').innerText = "Автор табылмады";
            }
        } catch (error) {
            console.error("Дерек алу қатесі:", error);
        }
    }

    // Батырма жұмыс істеуі үшін функцияны жаһандық деңгейге шығару
    window.searchAuthorPoems = function() {
        const name = document.getElementById('author-name').innerText;
        window.location.href = `poems.html?search=${encodeURIComponent(name)}`;
    };

    // Бет жүктелгенде іске қосу
    loadAuthorData();
</script>
    
<script src="js/menu.js"></script>
    
<script>
    function toggleMenu(){
        document.getElementById("menu").classList.toggle("show");
        document.getElementById("overlay").classList.toggle("show");
    }
</script>

<!-- Пікірлер үшін бөлек скрипт (егер ол v10 болса) -->
<script type="module" src="comments.js"></script>

</body>
</html>
