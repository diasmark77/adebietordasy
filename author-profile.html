<body>
    <div class="container" id="profile-content">
        <h2 id="author-name">Жүктелуде...</h2>
        <img id="photo" src="" alt="">
        <p id="bio"></p>
        <div id="work" class="poem-text"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ӨЗІҢНІҢ FIREBASE CONFIG ДЕРЕКТЕРІҢДІ ҚОЙ
        const firebaseConfig = {
            apiKey: "AIzaSyC_aLF4dK_m0jvkbSzhTWo3rsP7yx5uoXw",
            projectId: "adebiet-ordasy",
            appId: "1:331787955330:web:a77853b5bffdb44bed989b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');

        async function getAuthor() {
            if (id) {
                const docRef = doc(db, "published_content", id);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('name').innerText = data.name;
                    document.getElementById('photo').src = data.photoUrl || 'images/logo.png';
                    document.getElementById('bio').innerText = data.description;
                    document.getElementById('work').innerText = data.work;
                }
            }
        }
        getAuthor();
    </script>

<script>
// 1. Firebase конфигурациясы (Тырнақшаларды ұмытпа!)
const firebaseConfig = {
    apiKey: "AIzaSyC...", // Осы жерді міндетті түрде тырнақшаға ал!
    authDomain: "adebiet-ordasy.firebaseapp.com",
    projectId: "adebiet-ordasy",
    storageBucket: "adebiet-ordasy.appspot.com",
    messagingSenderId: "776364024545",
    appId: "1:776364024545:web:..."
};

// 2. Firebase-ті іске қосу
if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.firestore();

// 3. URL-ден автордың ID-ін алу (мысалы: ?id=WjMbm...)
const urlParams = new URLSearchParams(window.location.search);
const authorId = urlParams.get('id');

// 4. Деректерді базадан тарту функциясы
function loadAuthorData() {
    if (!authorId) {
        console.error("ID табылмады");
        return;
    }

    db.collection("published_content").doc(authorId).get().then((doc) => {
        if (doc.exists) {
            const data = doc.data();
            
            // HTML-дегі элементтерді толтыру
            document.getElementById('author-name').innerText = data.name;
            
            // Суретті тексеріп салу
            const photoImg = document.getElementById('author-photo');
            if (photoImg && data.photoUrl) {
                photoImg.src = data.photoUrl;
            }

            // Биографияны салу
            const bioText = document.getElementById('author-bio');
            if (bioText) {
                bioText.innerText = data.description;
            }
        } else {
            document.getElementById('author-name').innerText = "Автор табылмады";
        }
    }).catch((error) => {
        console.error("Қате шықты:", error);
    });
}

// Бет жүктелгенде функцияны іске қосу
window.onload = loadAuthorData;
            </script>
