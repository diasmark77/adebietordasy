<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="dynamic-title">Жүктелуде... | Әдебиет ордасы</title>
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/menu.css">
</head>
<body>

    <!-- 1. Контейнерлер (Функциялар осы жерлерге дерек салады) -->
    <div id="menu-container"></div>
    <div id="author-image-container" class="author-img-wrapper"></div>
    <div id="audio-player-container"></div>

    <div class="card">
        <h2 id="poem-title-display"></h2>
        <pre id="poem-content-display" style="white-space: pre-wrap; font-family: inherit;"></pre>
    </div>

    <div id="navigation-buttons" class="nav-wrapper"></div>
    <div id="related-poems-container"></div>
    <section id="comments-section" class="comments-section"></section>
    <div id="scroll-tools-container"></div>

    <!-- 2. Скрипттерді жүктеу (Реттілік маңызды!) -->
    <script src="../js/menu.js"></script>
    <script src="../js/audio-script.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/related.js"></script>
    <script src="../js/scroll-tools.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ✅ ОСЫ ЖЕРГЕ FIREBASE-ТЕН ӨЗ КОНФИГІҢДІ КӨШІРІП ҚОЙ!
        const firebaseConfig = { 
            apiKey: "AIza...",
            authDomain: "adebiet-ordasy.firebaseapp.com",
            projectId: "adebiet-ordasy",
            storageBucket: "adebiet-ordasy.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function initPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (!id) return;

            try {
                const docRef = doc(db, "published_content", id);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();

                    // Мәтіндік деректерді толтыру
                    document.getElementById('poem-title-display').innerText = data.workTitle || "";
                    document.getElementById('poem-content-display').innerText = data.work || "";
                    document.title = (data.workTitle || "Өлең") + " | Әдебиет ордасы";

                    // Функцияларды іске қосу
                    if (data.audioUrl && typeof initDynamicPlayer === "function") {
                        initDynamicPlayer(data); // Плеерді іске қосу
                    }

                    // Сыртқы файлдардағы басқа функциялар
                    if (window.renderAuthorImage) renderAuthorImage(data.authorImg);
                    if (window.renderNavButtons) renderNavButtons(data.authorPageUrl);
                }
            } catch (error) {
                console.error("Қате:", error);
            }
        }
        initPage();
    </script>

    <script type="module" src="../js/comments.js"></script>
</body>
</html>
