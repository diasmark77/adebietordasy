<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title id="dynamic-title">Автор профилі | Әдебиет ордасы</title>
    <meta name="description" id="meta-description" content="Қазақ жазушысы — Әдебиет ордасы">
    <meta name="keywords" id="meta-keywords" content="қазақ ақыны, әдебиет ордасы">

    <link rel="stylesheet" href="css/menu.css">
    <link rel="icon" href="images/logo.png" type="image/png">

    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f1ea; color: #333; line-height: 1.6; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
        header { text-align: center; padding: 40px 20px; background: #5c4033; color: white; }
        
        .author-img { 
            width: 100%; max-width: 320px; height: auto; 
            border-radius: 15px; margin: 20px 0; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.3); 
            border: 4px solid white;
        }

        .container { 
            width: 90%; max-width: 800px; 
            margin: -30px auto 20px; background: white; 
            padding: 25px; border-radius: 15px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            position: relative; 
            box-sizing: border-box;
        }

        h1#author-name { margin: 10px 0; font-size: 1.8rem; }
        #author-bio { font-size: 1.05rem; color: #444; margin-bottom: 25px; }
        
        .work-section { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; }
        .work-title { color: #5c4033; font-size: 1.4rem; margin-bottom: 15px; }
        
        pre#author-work {
            white-space: pre-wrap; 
            font-family: 'Times New Roman', serif; 
            background: #fafafa; 
            padding: 15px; 
            border-radius: 10px; 
            border-left: 5px solid #5c4033; 
            font-size: 1rem;
            color: #2c3e50;
            overflow-x: auto;
        }

        .back-btn { display: inline-block; margin-top: 20px; padding: 12px 20px; background: #5c4033; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; font-size: 0.9rem; }

        .comments-section { max-width: 760px; margin: 60px auto 40px; padding: 0 20px; font-family: 'Segoe UI', sans-serif; }
        .comments-title { font-size: 1.4rem; font-weight: 700; color: #3b1f0a; border-bottom: 2px solid #c8a06a; padding-bottom: 10px; margin-bottom: 24px; }
        .auth-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        #user-info { display: none; align-items: center; gap: 10px; }
        #user-photo { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid #c8a06a; }
        #user-name { font-size: 0.95rem; color: #3b1f0a; font-weight: 600; }
        .auth-btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        #login-btn { background: #4285f4; color: #fff; }
        #login-btn:hover { background: #2f6fd8; }
        #logout-btn { display: none; background: #f1e8db; color: #7a4520; }
        #logout-btn:hover { background: #e2d0bb; }
        #comment-form { display: none; margin-bottom: 28px; }
        #comment-input { width: 100%; min-height: 90px; padding: 12px 14px; border: 1.5px solid #d4b896; border-radius: 10px; font-size: 0.95rem; color: #2c1a0a; background: #fffaf5; resize: vertical; box-sizing: border-box; font-family: inherit; transition: border-color 0.2s; }
        #comment-input:focus { outline: none; border-color: #a0622a; }
        #submit-btn { margin-top: 10px; padding: 10px 24px; background: #8B4513; color: #fff; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        #submit-btn:hover { background: #6b3410; }
        #submit-btn:disabled { background: #c4a882; cursor: not-allowed; }
        #login-note { color: #9a7a5a; font-size: 0.9rem; margin-bottom: 20px; }
        .comment-card { display: flex; gap: 14px; padding: 16px; background: #fffaf5; border: 1px solid #e8d5ba; border-radius: 12px; margin-bottom: 14px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .comment-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #c8a06a; flex-shrink: 0; }
        .comment-body { flex: 1; }
        .comment-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
        .comment-name { font-weight: 700; font-size: 0.95rem; color: #3b1f0a; }
        .comment-date { font-size: 0.8rem; color: #b08060; }
        .comment-text { font-size: 0.95rem; color: #4a3020; line-height: 1.6; margin: 0; white-space: pre-wrap; }
        .loading-text, .no-comments, .error-text { text-align: center; color: #9a7a5a; padding: 20px 0; font-size: 0.95rem; }

        /* ═══════════════════════════════════════════════
           ТӨМЕНГІ МЕНЮ — iOS/Instagram стиліндегі tab bar
           (index.html-мен бірдей, сол сайттың сол мәзірі)
           ═══════════════════════════════════════════════ */
        nav.tabbar {
          all: unset !important;
          box-sizing: border-box !important;
          display: flex !important;
          flex-direction: row !important;
          position: fixed !important;
          top: auto !important;
          left: 10px !important;
          right: 10px !important;
          bottom: calc(10px + env(safe-area-inset-bottom)) !important;
          width: auto !important;
          height: auto !important;
          min-height: 0 !important;
          max-width: 520px !important;
          margin: 0 auto !important;
          transform: none !important;
          transition: none !important;
          align-items: stretch !important;
          justify-content: space-around !important;
          background: rgba(250, 247, 240, 0.92) !important;
          -webkit-backdrop-filter: saturate(180%) blur(20px) !important;
          backdrop-filter: saturate(180%) blur(20px) !important;
          border: 1px solid rgba(139, 94, 60, 0.14) !important;
          border-radius: 26px !important;
          box-shadow: 0 8px 28px rgba(44, 24, 16, 0.16) !important;
          padding: 8px 6px !important;
          z-index: 1000 !important;
        }

        .tabbar-indicator {
          position: absolute;
          top: 6px;
          height: 46px;
          border-radius: 20px;
          background: rgba(139, 94, 60, 0.13);
          box-shadow: inset 0 0 0 1px rgba(139, 94, 60, 0.16);
          transition: left 0.35s cubic-bezier(.34,1.56,.64,1),
                      width 0.35s cubic-bezier(.34,1.56,.64,1),
                      opacity 0.2s ease;
          pointer-events: none;
          opacity: 0;
        }

        .tabbar a {
          flex: 1 1 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 4px;
          text-decoration: none;
          color: #9c8874;
          padding: 9px 2px 7px;
          min-height: 46px;
          border-radius: 20px;
          -webkit-tap-highlight-color: transparent;
          transition: color 0.25s ease, transform 0.15s ease;
          position: relative;
          z-index: 1;
        }

        .tabbar a svg {
          width: 25px;
          height: 25px;
          stroke: currentColor;
          fill: none;
          stroke-width: 1.8;
          stroke-linecap: round;
          stroke-linejoin: round;
          transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
        }

        .tabbar a span {
          font-size: 10.5px;
          font-weight: 600;
          letter-spacing: 0.1px;
          line-height: 1.1;
          white-space: nowrap;
          transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .tabbar a:active {
          transform: scale(0.92);
        }

        .tabbar a.active {
          color: #6e472c;
          cursor: grab;
          touch-action: none;
        }

        .tabbar a.active svg {
          transform: translateY(-1px) scale(1.08);
        }

        .tabbar a.active:active {
          cursor: grabbing;
        }

        .tabbar-indicator.dragging {
          transform: scale(1.05);
          box-shadow: inset 0 0 0 1.5px rgba(139, 94, 60, 0.35), 0 6px 16px rgba(139, 94, 60, 0.28);
        }

        .tabbar a.drag-hover {
          color: #6e472c;
        }

        .tabbar a.drag-hover svg {
          transform: translateY(-1px) scale(1.12);
        }

        @media (max-width: 380px) {
          .tabbar a span { font-size: 9.5px; }
          .tabbar a svg { width: 21px; height: 21px; }
        }
    </style>

<!-- АВТОР ДЕРЕКТЕРІ ЛОГИКАСЫ (Supabase) -->
<script>
    const SUPABASE_URL = "https://rehdrlbhglnhajwtgohr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9-WTtRK7KHkr8dQ7x30Yew_Syacj2vB";
    const supabase     = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    async function loadAuthorData() {
        if (!id) return;
        try {
            const { data, error } = await supabase
                .from('authors')
                .select('*')
                .eq('id', id)
                .single();

            if (error) throw error;

            if (data) {
                const authorName = data.name || "Аты жоқ";
                const authorBio  = data.biography || "Мәлімет жоқ";

                document.getElementById('author-name').innerText = authorName;
                document.getElementById('author-bio').innerText  = authorBio;

                if (data.photoUrl) {
                    document.getElementById('author-photo').src = data.photoUrl;
                    document.getElementById('author-photo').alt = authorName;
                }

                const workBox = document.getElementById('author-work');
                if (data.sampleWork) {
                    workBox.innerText = data.sampleWork;
                } else {
                    document.getElementById('work-container').style.display = 'none';
                }

                // ===================================================
                // ✅ SEO БЛОГЫ — Schema.org + Canonical + Open Graph
                // ===================================================

                // 1. Title & Meta description
                document.title = `${authorName} — өмірбаяны және шығармалары | Әдебиет ордасы`;
                document.getElementById('meta-description').content =
                    `${authorName} — ${authorBio.substring(0, 150).replace(/\n/g, ' ')}`;
                document.getElementById('meta-keywords').content =
                    `${authorName}, ${authorName} өлеңдері, ${authorName} шығармалары, қазақ ақыны, әдебиет ордасы`;

                // 2. Schema.org (Google rich result үшін)
                const schema = {
                    "@context": "https://schema.org",
                    "@type": "Person",
                    "name": authorName,
                    "description": authorBio.substring(0, 300),
                    "url": `https://diasmark77.github.io/adebietordasy/author-profile.html?id=${id}`,
                    "image": data.photoUrl || "",
                    "jobTitle": "Қазақ жазушысы",
                    "nationality": "Қазақстан",
                    "mainEntityOfPage": {
                        "@type": "WebPage",
                        "@id": `https://diasmark77.github.io/adebietordasy/author-profile.html?id=${id}`
                    }
                };
                const schemaEl = document.createElement('script');
                schemaEl.type = 'application/ld+json';
                schemaEl.textContent = JSON.stringify(schema);
                document.head.appendChild(schemaEl);

                // 3. Canonical URL
                const canonEl = document.createElement('link');
                canonEl.rel  = 'canonical';
                canonEl.href = `https://diasmark77.github.io/adebietordasy/author-profile.html?id=${id}`;
                document.head.appendChild(canonEl);

                // 4. Open Graph (WhatsApp, Telegram, Facebook preview үшін)
                const ogTags = {
                    'og:title':       `${authorName} | Әдебиет ордасы`,
                    'og:description': authorBio.substring(0, 150).replace(/\n/g, ' '),
                    'og:url':         `https://diasmark77.github.io/adebietordasy/author-profile.html?id=${id}`,
                    'og:type':        'profile',
                    'og:site_name':   'Әдебиет ордасы',
                    'og:image':       data.photoUrl || ''
                };
                Object.entries(ogTags).forEach(([prop, content]) => {
                    if (!content) return;
                    const el = document.createElement('meta');
                    el.setAttribute('property', prop);
                    el.setAttribute('content', content);
                    document.head.appendChild(el);
                });

                // ===================================================
                // ✅ SEO БЛОГЫ АЯҚТАЛДЫ
                // ===================================================

            } else {
                document.getElementById('author-name').innerText = "Автор табылмады";
                document.getElementById('author-bio').innerText  = "";
            }
        } catch (e) {
            console.error(e);
            document.getElementById('author-name').innerText = "Автор табылмады";
            document.getElementById('author-bio').innerText  = "";
        }
    }

    window.searchAuthorPoems = function() {
        const name = document.getElementById('author-name').innerText;
        window.location.href = `poems.html?search=${encodeURIComponent(name)}`;
    };

    loadAuthorData();
</script>

<!-- ═══ Тіл-бардың JS логикасы (index.html-мен бірдей: белсенді бет + жылжымалы pill + сүйреу) ═══ -->
<script>
(function initTabbar() {
  const tabbar = document.getElementById('tabbar');
  const indicator = document.getElementById('tabbarIndicator');
  const tabs = Array.from(document.querySelectorAll('.tabbar a'));

  // Бұл бет (author-profile.html) сайт құрылымында "Авторлар" бөліміне жатады,
  // сондықтан тіл-барда сол батырма белсенді болып көрсетіледі.
  let current = location.pathname.split('/').pop() || 'index.html';
  if (current === 'author-profile.html') current = 'authors-filtre.html';

  tabs.forEach(a => a.classList.toggle('active', a.dataset.page === current));

  function getTabBox(tab) {
    const barRect = tabbar.getBoundingClientRect();
    const tabRect = tab.getBoundingClientRect();
    const pad = 6;
    return {
      left: tabRect.left - barRect.left + pad,
      width: tabRect.width - pad * 2
    };
  }

  function movePillTo(tab, animate) {
    if (!tab) { indicator.style.opacity = '0'; return; }
    const box = getTabBox(tab);
    indicator.style.transition = animate
      ? 'left 0.35s cubic-bezier(.34,1.56,.64,1), width 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.2s ease'
      : 'opacity 0.2s ease';
    indicator.style.left = box.left + 'px';
    indicator.style.width = box.width + 'px';
    indicator.style.opacity = '1';
  }

  function positionPill() {
    const activeTab = tabs.find(a => a.classList.contains('active'));
    movePillTo(activeTab, false);
  }

  positionPill();
  window.addEventListener('load', positionPill);
  window.addEventListener('resize', positionPill);

  let ignoreNextClick = false;

  function goToTab(tab) {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    movePillTo(tab, true);
    const href = tab.getAttribute('href');
    setTimeout(() => { location.href = href; }, 260);
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', function (e) {
      if (ignoreNextClick) { ignoreNextClick = false; e.preventDefault(); return; }
      if (tab.classList.contains('active')) return;
      e.preventDefault();
      goToTab(tab);
    });
  });

  let isDragging = false;
  let dragMoved = false;
  let activePointerId = null;

  tabbar.style.userSelect = 'none';
  tabbar.style.webkitUserSelect = 'none';

  tabbar.addEventListener('pointerdown', (e) => {
    const tab = e.target.closest('a');
    if (!tab || !tab.classList.contains('active')) return;
    isDragging = true;
    dragMoved = false;
    activePointerId = e.pointerId;
    try { tabbar.setPointerCapture(e.pointerId); } catch (err) {}
    indicator.classList.add('dragging');
    document.body.style.cursor = 'grabbing';
  });

  tabbar.addEventListener('pointermove', (e) => {
    if (!isDragging || e.pointerId !== activePointerId) return;
    dragMoved = true;
    e.preventDefault();

    const x = e.clientX;
    let targetTab = null;
    for (const tab of tabs) {
      const r = tab.getBoundingClientRect();
      if (x >= r.left && x <= r.right) { targetTab = tab; break; }
    }

    tabs.forEach(t => t.classList.remove('drag-hover'));
    if (targetTab) {
      targetTab.classList.add('drag-hover');
      indicator.style.transition = 'left 0.12s ease, width 0.12s ease';
      const box = getTabBox(targetTab);
      indicator.style.left = box.left + 'px';
      indicator.style.width = box.width + 'px';
    }
  }, { passive: false });

  function endDrag(e) {
    if (!isDragging) return;
    isDragging = false;
    document.body.style.cursor = '';
    indicator.classList.remove('dragging');

    const dropTab = tabs.find(t => t.classList.contains('drag-hover'));
    tabs.forEach(t => t.classList.remove('drag-hover'));

    if (dropTab && dragMoved) {
      if (dropTab.classList.contains('active')) {
        movePillTo(dropTab, true);
      } else {
        ignoreNextClick = true;
        setTimeout(() => { ignoreNextClick = false; }, 500);
        goToTab(dropTab);
      }
    } else {
      const activeTab = tabs.find(t => t.classList.contains('active'));
      movePillTo(activeTab, true);
    }
    dragMoved = false;
  }

  tabbar.addEventListener('pointerup', endDrag);
  tabbar.addEventListener('pointercancel', endDrag);
})();
</script>
