<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автор профилі | Әдебиет ордасы</title>
    <link rel="stylesheet" href="css/menu.css">
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f1ea; color: #333; line-height: 1.6; }
        header { text-align: center; padding: 40px 20px; background: #5c4033; color: white; }
        
        .author-img { 
            width: 100%; max-width: 320px; height: auto; 
            border-radius: 15px; margin: 20px 0; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.3); 
            border: 4px solid white;
        }

        .container { 
            width: 90%; max-width: 800px; 
            margin: -30px auto 20px; background: white; 
            padding: 25px; border-radius: 15px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            position: relative; 
            box-sizing: border-box;
        }

        h1#author-name { margin: 10px 0; font-size: 1.8rem; }
        #author-bio { font-size: 1.05rem; color: #444; margin-bottom: 25px; }
        
        .work-section { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; }
        .work-title { color: #5c4033; font-size: 1.4rem; margin-bottom: 15px; }
        
        pre#author-work {
            white-space: pre-wrap; 
            font-family: 'Times New Roman', serif; 
            background: #fafafa; 
            padding: 15px; 
            border-radius: 10px; 
            border-left: 5px solid #d4af37; 
            font-size: 1rem;
            color: #2c3e50;
            overflow-x: auto;
        }

        .back-btn { display: inline-block; margin-top: 20px; padding: 12px 20px; background: #d4af37; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; font-size: 0.9rem; }

        /* Пікірлер бөлімі стилі */
        .comments-section { width: 90%; max-width: 800px; margin: 40px auto; padding: 20px; background: white; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); box-sizing: border-box; }
        .comments-title { font-size: 1.3rem; color: #3b1f0a; border-bottom: 2px solid #c8a06a; padding-bottom: 10px; margin-bottom: 20px; }
        
        .auth-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        #user-info { display: none; align-items: center; gap: 10px; }
        #user-photo { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #c8a06a; }
        
        .auth-btn { padding: 8px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 5px; font-size: 0.85rem; }
        #login-btn { background: #4285f4; color: white; }
        #logout-btn { display: none; background: #eee; color: #333; }

        #comment-form { display: none; margin-top: 15px; }
        #comment-input { width: 100%; min-height: 80px; padding: 10px; border: 1px solid #d4b896; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        #submit-btn { margin-top: 10px; padding: 10px 20px; background: #8B4513; color: white; border: none; border-radius: 8px; cursor: pointer; }
        
        #login-note { color: #888; font-size: 0.9rem; }

        @media (max-width: 600px) {
            header { padding: 30px 10px; }
            h1#author-name { font-size: 1.5rem; }
            .container { padding: 15px; }
        }
    </style>
</head>
<body>

<header>
    <img id="author-photo" src="images/logo.png" alt="Автор суреті" class="author-img">
    <h1 id="author-name">Жүктелуде...</h1>
</header>

<div class="container">
    <p id="author-bio">Мәлімет жүктелуде...</p>

    <div id="work-container" class="work-section">
        <h2 class="work-title">Шығармадан үзінді</h2>
        <pre id="author-work">Жүктелуде...</pre>
    </div>
    
    <button onclick="searchAuthorPoems()" class="back-btn">
        🔍 Осы автордың барлық шығармалары
    </button>
</div>

<!-- Мәзір түймесі -->
<button class="menu-btn" onclick="toggleMenu()">☰</button>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<nav id="menu">
    <button onclick="location.href='index.html'">🏠 Басты бет</button>
    <button onclick="location.href='alash.html'">📜 Алаш зиялылары</button>
    <button onclick="location.href='writers.html'">📚 Қазақ жазушылары</button>
    <button onclick="location.href='poets.html'">✍️ Ақындар</button>
    <button onclick="location.href='poems.html'">📝 Өлеңдер</button>
</nav>

<!-- ПІКІРЛЕР БӨЛІМІ (ТЕК БІР РЕТ) -->
<section class="comments-section">
    <h2 class="comments-title">💬 Пікірлер</h2>
    
    <div class="auth-bar">
        <button id="login-btn" class="auth-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/split_chrome_button/google.svg" width="18">
            Google арқылы кіру
        </button>
        
        <div id="user-info">
            <img id="user-photo" src="" alt="avatar">
            <span id="user-name"></span>
        </div>
        <button id="logout-btn" class="auth-btn">Шығу</button>
    </div>

    <div id="comment-form">
        <textarea id="comment-input" placeholder="Пікіріңізді жазыңыз..."></textarea>
        <button id="submit-btn">Жіберу</button>
    </div>
    
    <p id="login-note">Пікір қалдыру үшін Google аккаунтымен кіріңіз.</p>
    
    <div id="comments-list"></div> <!-- comments.js осы жерге пікірлерді салады -->
</section>

<!-- FIREBASE ЛОГИКАСЫ -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC_aLF4dK_m0jvkbSzhTWo3rsP7yx5uoXw",
        authDomain: "adebiet-ordasy.firebaseapp.com",
        projectId: "adebiet-ordasy",
        storageBucket: "adebiet-ordasy.appspot.com",
        messagingSenderId: "776364024545",
        appId: "1:331787955330:web:a77853b5bffdb44bed989b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    async function loadAuthorData() {
        if (!id) return;
        try {
            const docRef = doc(db, "published_content", id);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('author-name').innerText = data.name || "Аты жоқ";
                document.getElementById('author-bio').innerText = data.description || "Мәлімет жоқ";
                if (data.photoUrl) document.getElementById('author-photo').src = data.photoUrl;

                const workBox = document.getElementById('author-work');
                if (data.work) {
                    workBox.innerText = data.work;
                } else {
                    document.getElementById('work-container').style.display = 'none';
                }
            }
        } catch (e) { console.error(e); }
    }

    window.searchAuthorPoems = function() {
        const name = document.getElementById('author-name').innerText;
        window.location.href = `poems.html?search=${encodeURIComponent(name)}`;
    };

    loadAuthorData();
</script>

<script src="js/menu.js"></script>
<script>
    function toggleMenu(){
        document.getElementById("menu").classList.toggle("show");
        document.getElementById("overlay").classList.toggle("show");
    }
</script>

<!-- Пікірлер скрипті -->
<script type="module" src="comments.js"></script>

</body>
</html>
