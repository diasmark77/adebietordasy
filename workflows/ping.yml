name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 9 */5 * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          "https://rehdrlbhglnhajwtgohr.supabase.co/rest/v1/authors?select=id&limit=1"
