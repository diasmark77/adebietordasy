<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ақындар | Әдебиет ордасы</title>

<link rel="icon" href="images/logo.png" type="image/png">
<link rel="stylesheet" href="css/menu.css">
  
<style>
* {box-sizing:border-box;}
body {margin:0;font-family:Arial,sans-serif;background:#f4f1ea;color:#333;}

header {
  background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url("images/kazakh-dalasy.jpg") center/cover no-repeat;
  color:white;
  text-align:center;
  padding:25px;
}

/* NAVIGATION */
nav {
  display:none;
  flex-direction:column;
  background:#8b5e3c;
}
nav button {
  background:none;
  border:none;
  color:white;
  padding:14px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
  border-top:1px solid rgba(255,255,255,0.2);
}
nav button:hover {background:#6e472c;}
nav.show{display:flex;}

.search-box {
  text-align: center;
  margin: 20px 0;
}
.search-box input {
  width: 60%;
  max-width: 600px;
  padding: 12px 15px;
  font-size: 16px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.cards-container {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
}

.card {
  background:white;
  color:#333;
  padding:20px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  width: 300px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  cursor: pointer;
  transition: 0.3s;
}
.card:hover {
  transform: translateY(-5px);
}

.card img {
  width:120px;
  border-radius:5px;
  margin-bottom:15px;
}

footer{
  background:#5c4033;
  color:white;
  text-align:center;
  padding:20px;
  margin-top:40px;
  width:100%;
}

@media(max-width:800px){
  .menu-btn{display:block;}
  nav{display:none;}
  nav.show{display:flex;}
}
@media(max-width:600px){
  nav button {width:90%; margin:3px 0;}
  .search-box input {width:95%;}
}
</style>
</head>

<body>

<header>
  <h1>Ақындар</h1>
  <p>Қазақ поэзиясының көрнекті тұлғалары</p>
</header>

<button class="menu-btn" onclick="toggleMenu()">☰</button>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<nav id="menu">
<button onclick="location.href='index.html'">🏠 Басты бет</button>
<button onclick="location.href='alash.html'">📜 Алаш зиялылары</button>
<button onclick="location.href='writers.html'">📚 Қазақ жазушылары</button>
<button onclick="location.href='poets.html'">✍️ Ақындар</button>
<button onclick="location.href='poemGame.html'">🎮 Қаламгер ойыны</button>
<button onclick="location.href='contact.html'">📩 Байланыс</button>
<button onclick="location.href='poems.html'">📝 Өлеңдер</button>
<button onclick="location.href='shygarms.html'">📑 Шығармалар</button>
</nav>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Іздеу авторлар мен шығармалар бойынша...">
</div>

<section>
  <div class="cards-container">

    <!-- КАРТОЧКАЛАР -->
    <div class="card" onclick="location.href='poet/abay.html'">
      <img src="images/abay.jpg">
      <h2>Абай Құнанбайұлы</h2>
      <p>Қазақтың ұлы ақыны</p>
    </div>

    <div class="card" onclick="location.href='poet/mukagali.html'">
      <img src="images/mukagali.jpg">
      <h2>Мұқағали Мақатаев</h2>
      <p>Лирик ақын</p>
    </div>

  </div>
</section>

<!-- МІНЕ ДҰРЫС ОРЫН -->
<footer>
  © 2026 Әдебиет ордасы | Қазақ әдеби порталы
</footer>

<script src="search.js"></script>

<script>
function toggleMenu(){
  document.getElementById("menu").classList.toggle("show");
  document.getElementById("overlay").classList.toggle("show");
}
</script>

</body>
</html>
