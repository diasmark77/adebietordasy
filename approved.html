<h1>Approved авторлар</h1>
<div id="authorsList"></div>

<script>
async function loadAuthors() {
  const res = await fetch('/authors/authors.json');
  const authors = await res.json();
  const container = document.getElementById('authorsList');
  authors.forEach(a => {
    const div = document.createElement('div');
    div.innerHTML = `
      <h2>${a.name} (${a.birth} - ${a.death})</h2>
      <img src="${a.photo}" width="120">
      <pre>${a.poems.join('\n')}</pre>
      <hr>
    `;
    container.appendChild(div);
  });
}
loadAuthors();
</script>
