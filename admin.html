<h1>Күтудегі авторлар</h1>
<div id="pendingList"></div>

<script>
async function loadPending() {
  const res = await fetch('/admin/pending');
  const pending = await res.json();
  const container = document.getElementById('pendingList');
  container.innerHTML = '';
  pending.forEach((p, i) => {
    const div = document.createElement('div');
    div.innerHTML = `
      <h3>${p.name} (${p.birth} - ${p.death})</h3>
      <img src="${p.photo}" width="100"><br>
      <pre>${p.poems.join('\n')}</pre>
      <button onclick="approve(${i})">Мақұлдау</button>
      <hr>
    `;
    container.appendChild(div);
  });
}
async function approve(index) {
  await fetch('/admin/approve', {
    method:'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ index })
  });
  loadPending();
}
loadPending();
</script>
