<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Әдебиет CMS</title>
</head>
<body>

<h2>Автор таңдау / қосу</h2>

<select id="authorSelect"></select>
<br><br>

<input id="newAuthor" placeholder="Жаңа автор қосу">
<button onclick="addAuthor()">Автор қосу</button>

<hr>

<h2>Шығарма қосу</h2>

<select id="type">
  <option value="өлең">Өлең</option>
  <option value="әңгіме">Әңгіме</option>
  <option value="нақыл">Нақыл сөз</option>
</select>

<br><br>

<input id="title" placeholder="Тақырып">
<br><br>

<textarea id="text" placeholder="Мәтін"></textarea>
<br><br>

<button onclick="addWork()">Қосу</button>

<hr>

<h2>Шығармалар</h2>
<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let authors = [];

// 🔹 AUTHORS LOAD
async function loadAuthors() {
  let snap = await getDocs(collection(db, "authors"));

  authors = [];
  let select = document.getElementById("authorSelect");
  select.innerHTML = "";

  snap.forEach(doc => {
    let data = doc.data();
    authors.push({ id: doc.id, name: data.name });

    let opt = document.createElement("option");
    opt.value = doc.id;
    opt.innerText = data.name;
    select.appendChild(opt);
  });
}

// 🔹 ADD AUTHOR
window.addAuthor = async function() {
  let name = document.getElementById("newAuthor").value;

  if(!name) return;

  await addDoc(collection(db, "authors"), {
    name: name
  });

  document.getElementById("newAuthor").value = "";
  loadAuthors();
}

// 🔹 ADD WORK
window.addWork = async function() {
  let authorId = document.getElementById("authorSelect").value;

  await addDoc(collection(db, "works"), {
    authorId: authorId,
    type: document.getElementById("type").value,
    title: document.getElementById("title").value,
    text: document.getElementById("text").value
  });

  alert("Қосылды!");
  loadWorks();
}

// 🔹 LOAD WORKS
async function loadWorks() {
  let list = document.getElementById("list");
  list.innerHTML = "";

  let snap = await getDocs(collection(db, "works"));

  snap.forEach(doc => {
    let d = doc.data();

    let authorName = authors.find(a => a.id === d.authorId)?.name || "Белгісіз";

    list.innerHTML += `
      <div style="border:1px solid #ccc; margin:10px; padding:10px;">
        <b>${d.title}</b> (${d.type}) - <i>${authorName}</i>
        <p>${d.text}</p>
      </div>
    `;
  });
}

loadAuthors();
loadWorks();

</script>

</body>
</html>
