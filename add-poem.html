<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Өлең қосу | Әдебиет ордасы</title>

<link rel="stylesheet" href="css/menu.css">
<link rel="icon" href="images/logo.png" type="image/png">

<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Georgia', serif; background: #f4f1ea; color: #333; line-height: 1.6; }

header {
    background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('images/kazakh-dalasy.jpg') center/cover no-repeat;
    color: white; text-align: center; padding: 50px 20px;
}
header h1 { font-size: 38px; margin-bottom: 10px; letter-spacing: 1px; }
header p { font-size: 16px; opacity: 0.85; margin: 0; }

.form-container {
    max-width: 700px;
    margin: -40px auto 40px;
    background: rgba(255,255,255,0.98);
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    position: relative;
    z-index: 10;
}

.form-group { margin-bottom: 20px; }
label { display: block; font-weight: bold; color: #5c4033; margin-bottom: 8px; }

input, textarea, select {
    width: 100%; padding: 12px; border: 1px solid #d3cdc0; border-radius: 8px;
    background: #fdfcf9; font-family: inherit; font-size: 16px; transition: 0.3s;
    color: #333;
}

input:focus, textarea:focus, select:focus {
    outline: none; border-color: #8b5e3c; background: #fff;
    box-shadow: 0 0 8px rgba(139,94,60,0.2);
}

.author-search-wrapper { position: relative; }
.ac-input-wrap { position: relative; }
.ac-input-wrap input { padding-left: 40px; }
.ac-icon {
    position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%); font-size: 16px;
    color: #9a8070; pointer-events: none;
}
.ac-spinner {
    display: none; position: absolute; right: 12px; top: 50%;
    transform: translateY(-50%); font-size: 16px;
    animation: ac-spin 0.8s linear infinite;
}
@keyframes ac-spin { to { transform: translateY(-50%) rotate(360deg); } }

#author-suggestions {
    display: none;
    position: absolute; top: 100%; left: 0; right: 0;
    background: #fff;
    border: 1px solid #d3cdc0;
    border-top: none;
    border-radius: 0 0 10px 10px;
    z-index: 100;
    max-height: 260px;
    overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}
.suggestion-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; cursor: pointer;
    border-bottom: 1px solid #f0ece4; transition: background 0.15s;
}
.suggestion-item:last-child { border-bottom: none; }
.suggestion-item:hover, .suggestion-item.ac-active { background: #fdf5e6; }
.suggestion-item img {
    width: 38px; height: 38px; border-radius: 50%;
    object-fit: cover; border: 2px solid #d4af37; flex-shrink: 0;
}
.suggestion-avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: #fdf5e6; display: flex; align-items: center;
    justify-content: center; font-weight: bold; font-size: 13px;
    color: #8b5e3c; flex-shrink: 0; border: 2px solid #d4af37;
}
.suggestion-info { flex: 1; min-width: 0; }
.suggestion-name { font-weight: bold; color: #5c4033; font-size: 14px; }
.suggestion-name mark { background: none; color: #8b5e3c; font-weight: bold; }
.suggestion-bio { font-size: 12px; color: #999; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.suggestion-badge {
    font-size: 11px; padding: 3px 8px; border-radius: 20px;
    white-space: nowrap; flex-shrink: 0;
}
.ac-empty { padding: 14px; text-align: center; color: #999; font-size: 14px; }

#selected-author-card {
    display: none; align-items: center; gap: 14px;
    background: #fdf6ec; border: 1px solid #d4af37;
    border-radius: 8px; padding: 12px 16px; margin-top: 10px;
}
#selected-author-card img {
    width: 48px; height: 48px; border-radius: 50%;
    object-fit: cover; border: 2px solid #d4af37;
}
.sel-avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: #fdf5e6; display: flex; align-items: center;
    justify-content: center; font-weight: bold; font-size: 15px;
    color: #8b5e3c; border: 2px solid #d4af37; flex-shrink: 0;
}
#selected-author-card .author-info { flex: 1; }
#selected-author-card .author-name { font-weight: bold; color: #5c4033; }
.clear-author {
    background: none; border: none; color: #999; cursor: pointer;
    font-size: 20px; padding: 0 4px; transition: 0.2s;
}
.clear-author:hover { color: #e74c3c; }

#poem-textarea {
    font-family: 'Georgia', serif;
    line-height: 1.9;
    min-height: 200px;
    resize: vertical;
}

.char-counter { font-size: 13px; color: #999; text-align: right; margin-top: 4px; }
.char-counter.warn { color: #e74c3c; }

.notice {
    font-size: 14px; color: #777; background: #fdf5e6;
    padding: 15px; border-left: 4px solid #d4af37; margin-bottom: 25px;
    border-radius: 0 8px 8px 0;
}

.btn-submit {
    background: #8b5e3c; color: white; border: none; padding: 15px 30px;
    border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold;
    width: 100%; transition: 0.3s; margin-top: 10px;
}
.btn-submit:hover:not(:disabled) { background: #5c4033; transform: translateY(-2px); }
.btn-submit:disabled { background: #c4a882; cursor: not-allowed; transform: none; }

#status {
    text-align: center; margin-top: 20px; font-weight: bold;
    font-size: 16px; padding: 10px; border-radius: 8px;
    display: none;
}
#status.show { display: block; }

.section-divider {
    display: flex; align-items: center; gap: 12px;
    margin: 28px 0 20px; color: #8b5e3c;
}
.section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #d3cdc0;
}
.section-divider span { font-weight: bold; font-size: 14px; white-space: nowrap; }

footer { background: #5c4033; color: white; text-align: center; padding: 20px; }

@media(max-width: 600px) {
    header h1 { font-size: 28px; }
    .form-container { margin: 20px; padding: 20px; }
}

.menu-btn {
    position: fixed; top: 15px; left: 15px; z-index: 1000;
    background: #8b5e3c; color: white; border: none;
    border-radius: 8px; padding: 10px 14px; font-size: 20px;
    cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
#menu {
    position: fixed; top: 0; left: -280px; width: 260px; height: 100%;
    background: #5c4033; z-index: 999; padding: 70px 20px 20px;
    transition: left 0.3s ease; overflow-y: auto;
}
#menu.show { left: 0; }
#menu button {
    display: block; width: 100%; background: none; border: none;
    color: white; font-size: 16px; padding: 12px 10px; text-align: left;
    cursor: pointer; border-radius: 6px; margin-bottom: 4px; transition: 0.2s;
}
#menu button:hover { background: rgba(255,255,255,0.15); }
.overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 998;
}
.overlay.show { display: block; }
</style>
</head>
<body>

<header>
    <h1>✍️ Өлең қосу</h1>
    <p>Жаңа өлеңді порталға жариялаңыз</p>
</header>

<button class="menu-btn" onclick="toggleMenu()">☰</button>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<nav id="menu">
    <button onclick="location.href='index.html'">🏠 Басты бет</button>
    <button onclick="location.href='authors-filtre.html'">✍️ Авторлар</button>
    <button onclick="location.href='poemGame.html'">🎮 Қаламгер ойыны</button>
    <button onclick="location.href='contact.html'">📩 Байланыс</button>
    <button onclick="location.href='poems.html'">📝 Өлеңдер</button>
    <button onclick="location.href='shygarms.html'">📑 Шығармалар</button>
</nav>

<section>
<div class="form-container">

    <div class="notice">
        <b>Ескерту:</b><br>
        • Өлең мәтіні кем дегенде 50 таңбадан тұруы тиіс.<br>
        • Автор міндетті түрде таңдалуы керек.<br>
        • Жіберілген өлең <b>әкімші бекіткеннен кейін</b> жарияланады.
    </div>

    <form id="poemForm">

        <div class="section-divider"><span>📌 Автор</span></div>

        <div class="form-group author-search-wrapper">
            <label>Автор іздеу:</label>
            <div class="ac-input-wrap">
                <span class="ac-icon">👤</span>
                <input type="text" id="author-search" placeholder="Автор атын жазыңыз..." autocomplete="off">
                <span class="ac-spinner" id="ac-spinner">⏳</span>
            </div>
            <div id="author-suggestions"></div>

            <div id="selected-author-card">
                <div class="sel-avatar" id="sel-avatar"></div>
                <div class="author-info">
                    <div class="author-name" id="sel-author-name"></div>
                </div>
                <button type="button" class="clear-author" onclick="clearAuthor()">✕</button>
            </div>
            <input type="hidden" id="author-id">
            <input type="hidden" id="author-name-hidden">
        </div>

        <div class="section-divider"><span>📝 Өлең</span></div>

        <div class="form-group">
            <label>Өлең тақырыбы:</label>
            <input type="text" id="poem-title" placeholder="Өлең атауын енгізіңіз" required>
        </div>

        <div class="form-group">
            <label>Өлең мәтіні:</label>
            <textarea id="poem-textarea" rows="12" placeholder="Өлең жолдарын осы жерге енгізіңіз..." required></textarea>
            <div class="char-counter" id="char-count">0 таңба</div>
        </div>

        <div class="section-divider"><span>🔗 Қосымша</span></div>

        <div class="form-group">
            <label>Аудио сілтемесі (міндетті емес):</label>
            <input type="url" id="audio-url" placeholder="https://...mp3 немесе YouTube сілтемесі">
        </div>

        <div class="form-group">
            <label>Суретке сілтеме (міндетті емес):</label>
            <input type="url" id="photo-url" placeholder="https://image-link.com/photo.jpg">
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">📤 Өлеңді жариялау</button>
    </form>

    <div id="status"></div>
</div>
</section>

<footer>
    © 2026 Әдебиет ордасы | Қазақ әдеби порталы
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://rehdrlbhglnhajwtgohr.supabase.co";
const SUPABASE_KEY = "sb_publishable_9-WTtRK7KHkr8dQ7x30Yew_Syacj2vB";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TG_TOKEN   = "8575113225:AAGA0i4BfLyvwOFPRdSnmd1ot4VTXHurfv0";
const TG_CHAT_ID = "5616776281";

const catMeta = {
    aqyn:       { label: '✍️ Ақын',         bg: '#fdf5e6', color: '#5c4033' },
    jazushy:    { label: '📚 Жазушы',        bg: '#e8f4fd', color: '#1a5276' },
    alash:      { label: '📜 Алаш зиялысы', bg: '#f9f0ff', color: '#6c3483' },
    kompozitor: { label: '🎵 Композитор',    bg: '#eafaf1', color: '#1e8449' },
};

const searchInput   = document.getElementById('author-search');
const suggestBox    = document.getElementById('author-suggestions');
const authorCard    = document.getElementById('selected-author-card');
const authorIdInput = document.getElementById('author-id');
const authorNameHid = document.getElementById('author-name-hidden');
const selName       = document.getElementById('sel-author-name');
const selAvatar     = document.getElementById('sel-avatar');
const poemTA        = document.getElementById('poem-textarea');
const charDisp      = document.getElementById('char-count');
const form          = document.getElementById('poemForm');
const statusEl      = document.getElementById('status');
const btn           = document.getElementById('submitBtn');
const spinner       = document.getElementById('ac-spinner');

let timer, results = [], active = -1;

function initials(name) {
    return name.trim().split(/\s+/).map(w => w[0]?.toUpperCase() || '').slice(0, 2).join('');
}

function highlight(text, query) {
    const esc = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return text.replace(new RegExp(`(${esc})`, 'gi'), '<mark>$1</mark>');
}

function showStatus(msg, color) {
    statusEl.innerHTML = msg;
    statusEl.style.color = color || '#333';
    statusEl.classList.add('show');
}

async function searchAuthors(q) {
    spinner.style.display = 'inline';
    try {
        const { data, error } = await sb
            .from('authors')
            .select('id, name, biography, category, photo_url')
            .ilike('name', `%${q}%`)
            .limit(6);

        if (error) throw error;
        results = data || [];
        renderSuggestions(q);
    } catch (e) {
        suggestBox.innerHTML = '<div class="ac-empty">❌ Қате орын алды</div>';
        suggestBox.style.display = 'block';
    } finally {
        spinner.style.display = 'none';
    }
}

function renderSuggestions(query) {
    if (!results.length) {
        suggestBox.innerHTML = '<div class="ac-empty">😔 Автор табылмады</div>';
        suggestBox.style.display = 'block';
        return;
    }
    suggestBox.innerHTML = results.map((a, i) => {
        const m = catMeta[a.category] || { label: '', bg: '#f4f1ea', color: '#888' };
        const avatarHtml = a.photo_url
            ? `<img src="${a.photo_url}" alt="${a.name}" onerror="this.outerHTML='<div class=\'suggestion-avatar\'>${initials(a.name)}</div>'">`
            : `<div class="suggestion-avatar">${initials(a.name)}</div>`;
        return `<div class="suggestion-item" id="sug-${i}"
            onmouseenter="hoverSug(${i})"
            onclick="selectAuthor(${i})">
            ${avatarHtml}
            <div class="suggestion-info">
                <div class="suggestion-name">${highlight(a.name, query)}</div>
                <div class="suggestion-bio">${a.biography ? a.biography.slice(0, 55) + '…' : ''}</div>
            </div>
            ${m.label ? `<span class="suggestion-badge" style="background:${m.bg};color:${m.color};">${m.label}</span>` : ''}
        </div>`;
    }).join('');
    suggestBox.style.display = 'block';
    active = -1;
}

function hoverSug(i) {
    document.querySelectorAll('.suggestion-item').forEach(el => el.classList.remove('ac-active'));
    const el = document.getElementById('sug-' + i);
    if (el) el.classList.add('ac-active');
    active = i;
}

function selectAuthor(i) {
    const a = results[i];
    authorIdInput.value  = a.id;
    authorNameHid.value  = a.name;
    selName.textContent  = a.name;
    selAvatar.textContent = initials(a.name);
    authorCard.style.display = 'flex';
    searchInput.value        = '';
    suggestBox.style.display = 'none';
    statusEl.classList.remove('show');
}

function clearAuthor() {
    authorIdInput.value      = '';
    authorNameHid.value      = '';
    authorCard.style.display = 'none';
    searchInput.value        = '';
}

searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();
    clearTimeout(timer);
    if (q.length < 1) { suggestBox.style.display = 'none'; return; }
    timer = setTimeout(() => searchAuthors(q), 280);
});

searchInput.addEventListener('keydown', e => {
    const items = document.querySelectorAll('.suggestion-item');
    if (!items.length || suggestBox.style.display === 'none') return;
    if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active + 1, items.length - 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); }
    else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); selectAuthor(active); return; }
    else if (e.key === 'Escape') { suggestBox.style.display = 'none'; return; }
    items.forEach((el, i) => el.classList.toggle('ac-active', i === active));
});

document.addEventListener('click', e => {
    if (!e.target.closest('.author-search-wrapper')) {
        suggestBox.style.display = 'none';
    }
});

poemTA.addEventListener('input', () => {
    const n = poemTA.value.length;
    charDisp.textContent = n + ' таңба';
    charDisp.classList.toggle('warn', n < 50 && n > 0);
});

async function sendTelegram(authorName, title, poemText) {
    try {
        const msg = `📝 *Жаңа өлең өтініші!*\n\n` +
                    `✍️ *Автор:* ${authorName}\n` +
                    `📖 *Тақырып:* ${title}\n\n` +
                    `${poemText.substring(0, 200)}${poemText.length > 200 ? '...' : ''}`;
        await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: TG_CHAT_ID, text: msg, parse_mode: 'Markdown' })
        });
    } catch (e) {
        console.warn('Telegram хабарлама жіберілмеді:', e);
    }
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const authorId   = authorIdInput.value.trim();
    const authorName = authorNameHid.value.trim();
    const title      = document.getElementById('poem-title').value.trim();
    const poemText   = poemTA.value.trim();
    const audioUrl   = document.getElementById('audio-url').value.trim();
    const photoUrl   = document.getElementById('photo-url').value.trim();

    if (!authorId) {
        showStatus('⚠️ Автор таңдалмады! Алдымен автор іздеп таңдаңыз.', '#e67e22');
        searchInput.focus();
        return;
    }
    if (!title) {
        showStatus('⚠️ Өлең тақырыбын жазыңыз!', '#e67e22');
        document.getElementById('poem-title').focus();
        return;
    }
    if (poemText.length < 50) {
        showStatus(`⚠️ Өлең тым қысқа! Қазір: ${poemText.length} таңба. Кем дегенде 50 таңба болуы керек.`, '#e67e22');
        poemTA.focus();
        return;
    }

    btn.disabled    = true;
    btn.textContent = '⏳ Жариялануда...';
    showStatus('⏳ Сақталуда, күте тұрыңыз...', '#8b5e3c');

    try {
        // ✅ poem_requests кестесіне жазылады (бұрын poems деп қате болған)
        const { error } = await sb.from('poem_requests').insert([{
            title,
            author_name: authorName,
            author_id:   authorId,
            poem_text:   poemText,
            audio_url:   audioUrl  || null,
            photo_url:   photoUrl  || null,
            created_at:  new Date().toISOString()
        }]);

        if (error) throw error;

        await sendTelegram(authorName, title, poemText);

        showStatus('✅ Өлең сәтті жіберілді! Әкімші бекіткеннен кейін жарияланады.', 'green');

        form.reset();
        authorIdInput.value      = '';
        authorNameHid.value      = '';
        authorCard.style.display = 'none';
        charDisp.textContent     = '0 таңба';
        charDisp.classList.remove('warn');

    } catch (err) {
        console.error('Supabase қатесі:', err);
        showStatus('❌ Қате орын алды: ' + err.message, 'red');
    } finally {
        btn.disabled    = false;
        btn.textContent = '📤 Өлеңді жариялау';
    }
});
</script>

<script>
function toggleMenu() {
    document.getElementById("menu").classList.toggle("show");
    document.getElementById("overlay").classList.toggle("show");
}
</script>
</body>
</html>
