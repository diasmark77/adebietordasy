<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Өлеңдер | Әдебиет ордасы</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="stylesheet" href="css/menu.css">
    
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f1ea; color: #333; line-height: 1.5; }

        header {
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url("images/kazakh-dalasy.jpg") center/cover no-repeat;
            color: white; text-align: center; padding: 60px 20px;
        }
        header h1 { font-size: 42px; margin-bottom: 10px; }

        .search-box { text-align: center; margin: 30px 0; }
        .search-box input {
            width: 85%; max-width: 500px; padding: 12px 15px;
            font-size: 16px; border-radius: 25px; border: 2px solid #8b5e3c;
            outline: none; transition: 0.3s;
        }
        .search-box input:focus { box-shadow: 0 0 10px rgba(139, 94, 60, 0.3); }

        .search-badge {
            display: none;
            text-align: center;
            margin: -10px 0 20px;
            font-size: 0.95rem;
            color: #8b5e3c;
        }
        .search-badge span {
            background: #f5e6d5;
            border: 1px solid #c8a06a;
            border-radius: 20px;
            padding: 5px 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .search-badge button {
            background: none; border: none; color: #8b5e3c;
            cursor: pointer; font-size: 1rem; padding: 0; line-height: 1;
        }

        section { padding: 0 15px 50px 15px; max-width: 900px; margin: auto; }

        .card {
            background: white; padding: 25px; margin: 20px 0;
            border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            cursor: pointer; transition: 0.3s; border-left: 5px solid #8b5e3c;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .card h2 { color: #5c4033; font-size: 22px; margin: 0 0 10px 0; }
        .card pre {
            white-space: pre-wrap; word-wrap: break-word;
            font-family: 'Georgia', serif; font-size: 16px; color: #555;
            display: -webkit-box; -webkit-line-clamp: 4;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .read-more { display: inline-block; margin-top: 15px; color: #8b5e3c; font-weight: bold; text-decoration: none; }
        .card.from-db { border-left-color: #8b5e3c; }

        .loading { text-align: center; font-size: 1.2rem; color: #8b5e3c; padding: 40px; }
        .no-results { text-align: center; color: #9a7a5a; padding: 40px; font-size: 1rem; }

        /* Debug панелі */
        #debug-panel {
            display: none;
            background: #fff3cd; border: 1px solid #ffc107;
            border-radius: 8px; padding: 15px; margin: 10px 15px;
            font-size: 0.85rem; color: #333; max-width: 870px; margin: 10px auto;
        }
        #debug-panel pre { margin: 5px 0; white-space: pre-wrap; word-break: break-all; }

        footer { background: #5c4033; color: white; text-align: center; padding: 20px; font-size: 14px; }

        @media(max-width:600px) {
            header h1 { font-size: 30px; }
            .card h2 { font-size: 18px; }
        }
    </style>
</head>
<body>

<header>
    <h1>📚 Әдебиет ордасы</h1>
    <p>Қазақ руханиятының әдеби ордасы</p>
</header>

<button class="menu-btn" onclick="toggleMenu()">☰</button>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<nav id="menu">
    <button onclick="location.href='index.html'">🏠 Басты бет</button>
    <button onclick="location.href='authors-filtre.html'">✍️ Авторлар</button>
    <button onclick="location.href='poemGame.html'">🎮 Қаламгер ойыны</button>
    <button onclick="location.href='contact.html'">📩 Байланыс</button>
    <button onclick="location.href='poems.html'">📝 Өлеңдер</button>
    <button onclick="location.href='shygarms.html'">📖 Шығармалар</button>
</nav>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Автор немесе өлең атымен іздеу...">
</div>

<div class="search-badge" id="searchBadge">
    <span>
        🔍 Іздеу: <strong id="badgeText"></strong>
        <button onclick="clearSearch()" title="Тазалау">✕</button>
    </span>
</div>

<!-- Debug панелі — іздеу жұмыс жасамаса себебін көрсетеді -->
<div id="debug-panel">
    <strong>🔍 Іздеу ақпараты:</strong>
    <pre id="debug-text"></pre>
</div>

<section>
    <div id="db-poems-section" style="display:none;">
        <div id="poems-container"></div>
    </div>
</section>

<footer>
    © 2026 Әдебиет ордасы | Қазақ әдеби порталы
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
        getFirestore, collection, getDocs
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC_aLF4dK_m0jvkbSzhTWo3rsP7yx5uoXw",
        authDomain: "adebiet-ordasy.firebaseapp.com",
        projectId: "adebiet-ordasy",
        storageBucket: "adebiet-ordasy.appspot.com",
        messagingSenderId: "776364024545",
        appId: "1:331787955330:web:a77853b5bffdb44bed989b"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    let dbPoems = [];

    // ── Нормализация: қазақ/орыс әріптерін есепке алып салыстыру ──
    function normalize(str) {
        if (!str) return '';
        return str
            .toLowerCase()
            .replace(/ё/g, 'е')
            .trim();
    }

    // ── Ат бойынша дәл сәйкестік немесе ішінара сәйкестік ──
    function matchesSearch(poem, term) {
        const normTerm = normalize(term);
        const normAuthor = normalize(poem.authorName || poem.author || poem.name || '');
        const normTitle  = normalize(poem.title || '');
        const normText   = normalize(poem.poemText || poem.text || poem.content || '');

        return (
            normAuthor.includes(normTerm) ||
            normTitle.includes(normTerm)  ||
            normText.includes(normTerm)
        );
    }

    async function fetchPoems() {
        const container = document.getElementById('poems-container');
        const section   = document.getElementById('db-poems-section');

        container.innerHTML = '<div class="loading">Жүктелуде...</div>';
        section.style.display = 'block';

        try {
            const snap = await getDocs(collection(db, "poems"));
            console.log("✅ poems жазба саны:", snap.size);

            dbPoems = snap.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => {
                    const aT = a.addedAt?.toMillis ? a.addedAt.toMillis() : 0;
                    const bT = b.addedAt?.toMillis ? b.addedAt.toMillis() : 0;
                    return bT - aT;
                });

            // URL параметрін тексер
            const params    = new URLSearchParams(window.location.search);
            const urlSearch = params.get('search');

            if (urlSearch && urlSearch.trim()) {
                const term = urlSearch.trim();
                document.getElementById('searchInput').value = term;
                showSearchBadge(term);
                filterAndRender(term);
            } else {
                renderDbPoems(dbPoems);
            }

        } catch (error) {
            console.error("❌ Firebase қатесі:", error.code, error.message);
            container.innerHTML = '<p style="color:#c0392b;text-align:center;padding:20px;">' +
                '⚠️ Өлеңдерді жүктеу мүмкін болмады. Желіні тексеріңіз.</p>';
        }
    }

    function filterAndRender(term) {
        if (!term || !term.trim()) {
            renderDbPoems(dbPoems);
            hideDebug();
            return;
        }

        const filtered = dbPoems.filter(p => matchesSearch(p, term));

        // Debug панелі — нәтиже болмаса себебін көрсет
        if (filtered.length === 0 && dbPoems.length > 0) {
            const sample = dbPoems.slice(0, 3).map(p => ({
                authorName: p.authorName,
                author:     p.author,
                name:       p.name,
                title:      p.title
            }));
            showDebug(
                `Іздеу: "${term}"\n` +
                `Барлық өлең саны: ${dbPoems.length}\n` +
                `Табылды: 0\n\n` +
                `Алғашқы 3 өлеңнің автор өрістері:\n` +
                JSON.stringify(sample, null, 2)
            );
        } else {
            hideDebug();
        }

        renderDbPoems(filtered);
    }

    function renderDbPoems(list) {
        const container = document.getElementById('poems-container');
        const section   = document.getElementById('db-poems-section');

        container.innerHTML = '';
        section.style.display = 'block';

        if (list.length === 0) {
            container.innerHTML = '<p class="no-results">😔 Ешқандай өлең табылмады.</p>';
            return;
        }

        list.forEach(poem => {
            const card = document.createElement('div');
            card.className = 'card from-db';

            const title      = poem.title      || 'Өлең';
            const authorName = poem.authorName || poem.author || poem.name || 'Белгісіз автор';
            const poemText   = poem.poemText   || poem.text  || poem.content || '';
            const preview    = poemText.substring(0, 200);

            card.innerHTML = `
                <h2>${authorName} &laquo;${title}&raquo;</h2>
                <pre>${preview}${poemText.length > 200 ? '...' : ''}</pre>
                <span class="read-more">Толығырақ →</span>
            `;

            card.addEventListener('click', () => {
                window.location.href = `poem-view.html?id=${poem.id}`;
            });

            container.appendChild(card);
        });
    }

    function showSearchBadge(term) {
        document.getElementById('badgeText').textContent = term;
        document.getElementById('searchBadge').style.display = 'block';
    }

    function hideBadge() {
        document.getElementById('searchBadge').style.display = 'none';
    }

    function showDebug(text) {
        document.getElementById('debug-panel').style.display = 'block';
        document.getElementById('debug-text').textContent = text;
    }

    function hideDebug() {
        document.getElementById('debug-panel').style.display = 'none';
    }

    window.clearSearch = function() {
        document.getElementById('searchInput').value = '';
        hideBadge();
        hideDebug();
        renderDbPoems(dbPoems);
        history.replaceState(null, '', window.location.pathname);
    };

    // ── Қолмен іздеу ──
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const term = e.target.value.trim();
        history.replaceState(null, '', window.location.pathname);

        if (term) {
            showSearchBadge(term);
            filterAndRender(term);
        } else {
            hideBadge();
            hideDebug();
            renderDbPoems(dbPoems);
        }
    });

    fetchPoems();
</script>

<script>
    function toggleMenu() {
        document.getElementById("menu").classList.toggle("show");
        document.getElementById("overlay").classList.toggle("show");
    }
</script>

</body>
</html>
