<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Өлеңдер | Әдебиет ордасы</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="stylesheet" href="css/menu.css">
    
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f1ea; color: #333; line-height: 1.5; }

        header {
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url("images/kazakh-dalasy.jpg") center/cover no-repeat;
            color: white; text-align: center; padding: 60px 20px;
        }
        header h1 { font-size: 42px; margin-bottom: 10px; }

        .search-box { text-align: center; margin: 30px 0; }
        .search-box input {
            width: 85%; max-width: 500px; padding: 12px 15px;
            font-size: 16px; border-radius: 25px; border: 2px solid #8b5e3c;
            outline: none; transition: 0.3s;
        }
        .search-box input:focus { box-shadow: 0 0 10px rgba(139, 94, 60, 0.3); }

        section { padding: 0 15px 50px 15px; max-width: 900px; margin: auto; }
        
        .card {
            background: white; padding: 25px; margin: 20px 0;
            border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            cursor: pointer; transition: 0.3s; border-left: 5px solid #8b5e3c;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .card h2 { color: #5c4033; font-size: 22px; margin: 0 0 10px 0; }
        .card pre {
            white-space: pre-wrap; word-wrap: break-word;
            font-family: 'Georgia', serif; font-size: 16px; color: #555;
            display: -webkit-box; -webkit-line-clamp: 4;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .read-more { display: inline-block; margin-top: 15px; color: #8b5e3c; font-weight: bold; text-decoration: none; }

        /* Firebase-тен келген өлеңдер */
        .card.from-db { border-left-color: #d4af37; }

        .loading { text-align: center; font-size: 1.2rem; color: #8b5e3c; padding: 40px; }

        footer { background: #5c4033; color: white; text-align: center; padding: 20px; font-size: 14px; }

        @media(max-width:600px) {
            header h1 { font-size: 30px; }
            .card h2 { font-size: 18px; }
        }
    </style>
</head>
<body>

<header>
    <h1>📚 Әдебиет ордасы</h1>
    <p>Қазақ руханиятының әдеби ордасы</p>
</header>

<button class="menu-btn" onclick="toggleMenu()">☰</button>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<nav id="menu">
    <button onclick="location.href='index.html'">🏠 Басты бет</button>
    <button onclick="location.href='authors-filtre.html'">✍️ Авторлар</button>
    <button onclick="location.href='poemGame.html'">🎮 Қаламгер ойыны</button>
    <button onclick="location.href='contact.html'">📩 Байланыс</button>
    <button onclick="location.href='poems.html'">📝 Өлеңдер</button>
    <button onclick="location.href='shygarms.html'">📖 Шығармалар</button>
</nav>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Автор немесе өлең атымен іздеу...">
</div>

<!-- Firebase-тен жүктелген өлеңдер -->
<section>
    <div id="db-poems-section" style="display:none;">
        <div id="poems-container"></div>
    </div>
</section>

<footer>
    © 2026 Әдебиет ордасы | Қазақ әдеби порталы
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
        getFirestore, collection, getDocs
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC_aLF4dK_m0jvkbSzhTWo3rsP7yx5uoXw",
        authDomain: "adebiet-ordasy.firebaseapp.com",
        projectId: "adebiet-ordasy",
        storageBucket: "adebiet-ordasy.appspot.com",
        messagingSenderId: "776364024545",
        appId: "1:331787955330:web:a77853b5bffdb44bed989b"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    let dbPoems = [];

    async function fetchPoems() {
        const container = document.getElementById('poems-container');
        const section   = document.getElementById('db-poems-section');

        container.innerHTML = '<div class="loading">Жүктелуде...</div>';

        try {
            const snap = await getDocs(collection(db, "poems"));

            console.log("✅ poems коллекциясы — жазба саны:", snap.size);

            dbPoems = snap.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => {
                    const aT = a.addedAt?.toMillis ? a.addedAt.toMillis() : 0;
                    const bT = b.addedAt?.toMillis ? b.addedAt.toMillis() : 0;
                    return bT - aT;
                });

            if (dbPoems.length > 0) {
                section.style.display = 'block';
                renderDbPoems(dbPoems);
            } else {
                container.innerHTML = '';
                section.style.display = 'none';
            }

        } catch (error) {
            console.error("❌ Firebase қатесі:", error.code, error.message);
            container.innerHTML = '<p style="color:#c0392b;text-align:center;padding:20px;">' +
                '⚠️ Өлеңдерді жүктеу мүмкін болмады. Желіні тексеріңіз.</p>';
        }
    }

    function renderDbPoems(list) {
        const container = document.getElementById('poems-container');
        const section   = document.getElementById('db-poems-section');

        container.innerHTML = '';

        if (list.length === 0) {
            section.style.display = 'none';
            return;
        }

        section.style.display = 'block';

        list.forEach(poem => {
            const card = document.createElement('div');
            card.className = 'card from-db';

            const title      = poem.title      || 'Өлең';
            const authorName = poem.authorName || 'Белгісіз автор';
            const poemText   = poem.poemText   || '';
            const preview    = poemText.substring(0, 200);

            card.innerHTML = `
                <h2>${authorName} &laquo;${title}&raquo;</h2>
                <pre>${preview}${poemText.length > 200 ? '...' : ''}</pre>
                <span class="read-more">Толығырақ →</span>
            `;

            card.addEventListener('click', () => {
                window.location.href = `poem-view.html?id=${poem.id}`;
            });

            container.appendChild(card);
        });
    }

    // ── Іздеу логикасы ──
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase().trim();

        if (term) {
            const filtered = dbPoems.filter(p =>
                (p.authorName || '').toLowerCase().includes(term) ||
                (p.title      || '').toLowerCase().includes(term) ||
                (p.poemText   || '').toLowerCase().includes(term)
            );
            renderDbPoems(filtered);
        } else {
            renderDbPoems(dbPoems);
        }

        document.querySelectorAll('#static-poems .card').forEach(card => {
            const text = card.textContent.toLowerCase();
            card.style.display = text.includes(term) ? '' : 'none';
        });
    });

    fetchPoems();
</script>

<script>
    function toggleMenu() {
        document.getElementById("menu").classList.toggle("show");
        document.getElementById("overlay").classList.toggle("show");
    }
</script>

</body>
</html>
