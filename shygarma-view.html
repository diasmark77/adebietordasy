<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шығарма — Әдебиет ордасы</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="icon" href="images/logo.png" type="image/png">
<link rel="stylesheet" href="css/menu.css">
  
<link rel="stylesheet" href="css/style.css">


<style>
  :root {
    --paper: #faf7f2;
    --ink: #1a1208;
    --ink-muted: #5c4d38;
    --ink-faint: #9e8c73;
    --accent: #7a4a1e;
    --accent-light: #f0e6d8;
    --rule: #d6c9b5;
    --font-serif: 'Merriweather', 'Noto Serif', Georgia, serif;
    --reading-width: 680px;
    --line-height: 1.95;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-serif);
    background: var(--paper);
    color: var(--ink);
    font-size: 17px;
    line-height: var(--line-height);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Loading / Error ── */
  #page-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    gap: 16px;
    color: var(--ink-faint);
    font-style: italic;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 2px solid var(--rule);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #page-error {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    gap: 12px;
    text-align: center;
    color: var(--ink-faint);
    padding: 24px;
  }
  #page-error h2 { font-size: 20px; color: var(--accent); }

  #page-content { display: none; }

  /* ── Author banner ── */
  .author-img {
    display: block;
    width: 100%;
    max-height: 260px;
    object-fit: cover;
    object-position: center top;
    filter: sepia(20%) contrast(0.95);
  }
  .author-img-placeholder {
    width: 100%;
    height: 160px;
    background: linear-gradient(135deg, #2d1f0e 0%, #5c3d1a 100%);
  }

  /* ── Reading progress bar ── */
  #progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    width: 0%;
    background: var(--accent);
    z-index: 1000;
    transition: width 0.1s linear;
  }

  /* ── Main article wrapper ── */
  .article-wrap {
    max-width: var(--reading-width);
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* ── Work header ── */
  .work-header {
    text-align: center;
    padding: 52px 0 36px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 48px;
  }

  .work-genre {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    font-family: 'Merriweather', serif;
    font-weight: 300;
    margin-bottom: 16px;
  }

  .work-title {
    font-size: clamp(26px, 5vw, 38px);
    font-weight: 700;
    color: var(--ink);
    line-height: 1.25;
    margin-bottom: 14px;
    letter-spacing: -0.01em;
  }

  .work-author {
    font-size: 15px;
    color: var(--ink-muted);
    font-style: italic;
    font-weight: 300;
  }

  .work-author a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    transition: border-color 0.2s;
  }
  .work-author a:hover { border-color: var(--accent); }

  /* ── Reading controls ── */
  .reading-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 40px;
    padding: 12px 16px;
    background: var(--accent-light);
    border-radius: 8px;
    border: 1px solid var(--rule);
    flex-wrap: wrap;
  }

  .controls-label {
    font-size: 12px;
    color: var(--ink-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-style: normal;
  }

  .font-size-btns { display: flex; gap: 4px; align-items: center; }

  .font-btn {
    background: none;
    border: 1px solid var(--rule);
    border-radius: 4px;
    cursor: pointer;
    color: var(--ink-muted);
    padding: 4px 10px;
    font-family: var(--font-serif);
    transition: all 0.15s;
  }
  .font-btn:hover { background: white; color: var(--accent); border-color: var(--accent); }
  .font-btn.small { font-size: 13px; }
  .font-btn.large { font-size: 18px; }

  .read-time { font-size: 13px; color: var(--ink-faint); font-style: italic; }

  /* ── The prose itself ── */
  .work-body {
    font-size: var(--body-size, 17px);
    line-height: var(--line-height);
    color: var(--ink);
    transition: font-size 0.2s;
  }

  .work-body p {
    margin-bottom: 1.5em;
    text-align: justify;
    hyphens: auto;
    -webkit-hyphens: auto;
  }

  /* First paragraph drop cap */
  .work-body p:first-of-type::first-letter {
    float: left;
    font-size: 4.2em;
    line-height: 0.8;
    font-weight: 700;
    color: var(--accent);
    margin: 0.06em 0.08em 0 0;
    font-family: 'Merriweather', serif;
  }

  /* Scene break */
  .scene-break {
    text-align: center;
    color: var(--ink-faint);
    margin: 2.5em 0;
    font-size: 20px;
    letter-spacing: 0.5em;
    user-select: none;
  }

  /* ── Decorative divider ── */
  .section-rule {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 48px 0;
    color: var(--rule);
    font-size: 18px;
    letter-spacing: 0.3em;
  }
  .section-rule::before,
  .section-rule::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--rule);
  }

  /* ── Annotation block ── */
  .annotation-block {
    background: var(--accent-light);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 16px 20px;
    margin-bottom: 32px;
    font-style: italic;
    font-size: 15px;
    color: var(--ink-muted);
    line-height: 1.7;
  }
  .annotation-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
    font-style: normal;
  }

  /* ── Navigation buttons ── */
  .nav-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 56px;
    padding-top: 28px;
    border-top: 1px solid var(--rule);
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: var(--accent-light);
    color: var(--accent);
    border: 1px solid var(--rule);
    border-radius: 6px;
    font-family: var(--font-serif);
    font-size: 14px;
    text-decoration: none;
    transition: all 0.15s;
    cursor: pointer;
  }
  .back-btn:hover {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  /* ── Sticky mini header ── */
  #sticky-header {
    position: fixed;
    top: 3px; left: 0; right: 0;
    background: rgba(250, 247, 242, 0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--rule);
    padding: 10px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transform: translateY(-110%);
    transition: transform 0.3s ease;
    z-index: 100;
    font-size: 13px;
  }
  #sticky-header.visible { transform: translateY(0); }
  #sticky-title { font-weight: 600; color: var(--ink); }
  #sticky-author { color: var(--ink-muted); font-style: italic; }

  /* ── Comments section ── */
  .comments-section {
    max-width: var(--reading-width);
    margin: 60px auto 40px;
    padding: 0 24px;
    font-family: var(--font-serif);
  }
  .comments-title {
    font-size: 1.2rem; font-weight: 700; color: var(--accent);
    border-bottom: 1px solid var(--rule);
    padding-bottom: 12px; margin-bottom: 28px;
  }
  .auth-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  #user-info { display: none; align-items: center; gap: 10px; }
  #user-photo { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid var(--rule); }
  #user-name { font-size: 0.95rem; color: var(--ink); font-weight: 600; }
  .auth-btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: var(--font-serif); }
  #login-btn { background: #4285f4; color: #fff; }
  #login-btn:hover { background: #2f6fd8; }
  #logout-btn { display: none; background: var(--accent-light); color: var(--accent); border: 1px solid var(--rule); }
  #logout-btn:hover { background: var(--accent); color: white; }
  #comment-form { display: none; margin-bottom: 28px; }
  #comment-input { width: 100%; min-height: 90px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 6px; font-size: 0.95rem; color: var(--ink); background: white; resize: vertical; box-sizing: border-box; font-family: var(--font-serif); }
  #comment-input:focus { outline: none; border-color: var(--accent); }
  #submit-btn { margin-top: 10px; padding: 10px 24px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; font-family: var(--font-serif); }
  #submit-btn:hover { background: #5e3614; }
  #login-note { color: var(--ink-faint); font-size: 0.9rem; margin-bottom: 20px; font-style: italic; }
  .comment-card { display: flex; gap: 14px; padding: 18px; background: white; border: 1px solid var(--rule); border-radius: 8px; margin-bottom: 14px; }
  .comment-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--rule); flex-shrink: 0; }
  .comment-body { flex: 1; }
  .comment-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .comment-name { font-weight: 700; font-size: 0.9rem; color: var(--ink); }
  .comment-date { font-size: 0.78rem; color: var(--ink-faint); }
  .comment-text { font-size: 0.93rem; color: var(--ink-muted); line-height: 1.7; margin: 0; white-space: pre-wrap; }
  .loading-text, .no-comments, .error-text { text-align: center; color: var(--ink-faint); padding: 20px 0; font-size: 0.95rem; font-style: italic; }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .article-wrap { padding: 0 16px 60px; }
    .work-header { padding: 36px 0 28px; }
    .work-body p:first-of-type::first-letter { font-size: 3.4em; }
    .reading-controls { gap: 8px; }
  }
</style>

<script type="module">
import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyC_aLF4dK_m0jvkbSzhTWo3rsP7yx5uoXw",
  authDomain:        "adebiet-ordasy.firebaseapp.com",
  projectId:         "adebiet-ordasy",
  storageBucket:     "adebiet-ordasy.appspot.com",
  messagingSenderId: "776364024545",
  appId:             "1:331787955330:web:a77853b5bffdb44bed989b"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

/* URL-ден id алу: shygarma-view.html?id=XXXX */
const params = new URLSearchParams(location.search);
const shygarmaId = params.get('id');

async function loadShygarma() {
  if (!shygarmaId) return showError();

  try {
    /* Алдымен жарияланған шығармалардан іздейміз */
    let snap = await getDoc(doc(db, 'shygarmalar', shygarmaId));

    /* Табылмаса — өтініштен іздейміз (тікелей сілтеме үшін) */
    if (!snap.exists()) {
      snap = await getDoc(doc(db, 'shygarma_requests', shygarmaId));
    }

    if (!snap.exists()) return showError();

    const d = snap.data();
    renderPage(d);
  } catch (e) {
    console.error(e);
    showError();
  }
}

function showError() {
  document.getElementById('page-loading').style.display = 'none';
  document.getElementById('page-error').style.display   = 'flex';
}

function renderPage(d) {
  /* Тақырып */
  const title      = d.title      || 'Атауы жоқ';
  const authorName = d.authorName || 'Белгісіз';
  const genreLabel = d.genreLabel || d.genre || '';

  document.title = `${title} — ${authorName} | Әдебиет ордасы`;

  /* Sticky header */
  document.getElementById('sticky-title').textContent  = title;
  document.getElementById('sticky-author').textContent = authorName;

  /* Жанр */
  const genreEl = document.getElementById('work-genre');
  if (genreLabel) genreEl.textContent = genreLabel;
  else genreEl.style.display = 'none';

  /* Атау */
  document.getElementById('work-title').textContent = title;

  /* Автор сілтемесі */
  const authorLine = document.getElementById('work-author-line');
  if (d.authorId) {
    authorLine.innerHTML = `<a href="../writers/${d.authorId}.html">${authorName}</a>`;
    document.getElementById('author-back-btn').href = `../writers/${d.authorId}.html`;
    document.getElementById('author-back-btn').textContent = '← Автор бетіне';
  } else {
    authorLine.textContent = authorName;
    document.getElementById('author-back-btn').style.display = 'none';
  }

  /* Аннотация */
  if (d.annotation) {
    document.getElementById('annotation-block').style.display = 'block';
    document.getElementById('annotation-text').textContent    = d.annotation;
  }

  /* Автор суреті (banner) */
  const bannerWrap = document.getElementById('banner-wrap');
  if (d.photoUrl) {
    bannerWrap.innerHTML = `<img src="${d.photoUrl}" alt="${authorName}" class="author-img">`;
  } else {
    bannerWrap.innerHTML = `<div class="author-img-placeholder"></div>`;
  }

  /* Мәтін — абзацтарға бөліп <p> тегіне орап шығарамыз */
  const bodyEl = document.getElementById('work-body');
  const rawText = d.textContent || '';

  /* *** немесе --- белгілерін сцена үзілісіне айналдырамыз */
  const sceneBreak = '<div class="scene-break" aria-hidden="true">✦ &nbsp; ✦ &nbsp; ✦</div>';
  const paragraphs = rawText
    .split(/\n{2,}/)          /* екі жол үзілісі = жаңа абзац */
    .map(para => para.trim())
    .filter(Boolean)
    .map(para => {
      if (/^\*{3,}$|^-{3,}$/.test(para)) return sceneBreak;
      /* Бір жол үзілісі ішінде сақталады */
      const escaped = para
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\n/g, '<br>');
      return `<p>${escaped}</p>`;
    })
    .join('');

  bodyEl.innerHTML = paragraphs || '<p>Мәтін жоқ.</p>';

  /* Оқу уақыты */
  const words   = rawText.trim().split(/\s+/).length;
  const minutes = Math.ceil(words / 200);
  document.getElementById('read-time').textContent = `≈ ${minutes} минут оқу`;

  /* Беттерді көрсетеміз */
  document.getElementById('page-loading').style.display = 'none';
  document.getElementById('page-content').style.display = 'block';
}

loadShygarma();
</script>

<!-- ══ UI скрипттер ══ -->
<script>
  /* Оқу прогресс жолағы */
  window.addEventListener('scroll', () => {
    const doc     = document.documentElement;
    const scrolled = doc.scrollTop;
    const total   = doc.scrollHeight - doc.clientHeight;
    document.getElementById('progress-bar').style.width = (total > 0 ? scrolled / total * 100 : 0) + '%';

    const sticky = document.getElementById('sticky-header');
    sticky.classList.toggle('visible', scrolled > 300);
  });

  /* Қаріп өлшемі */
  let fontSize = 17;
  function changeFont(dir) {
    if (dir === 0) fontSize = 17;
    else fontSize = Math.min(22, Math.max(14, fontSize + dir * 1.5));
    document.getElementById('work-body').style.fontSize = fontSize + 'px';
  }

  /* Мәзір */
  function toggleMenu() {
    document.getElementById('menu').classList.toggle('show');
    document.getElementById('overlay').classList.toggle('show');
  }
</script>
