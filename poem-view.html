<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="dynamic-title">Жүктелуде... | Әдебиет ордасы</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="icon" href="images/logo.png" type="image/png">

    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f1ea; color: #333; text-align: left; padding-bottom: 80px; }
        .card { background: white; padding: 20px; margin: 20px auto; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 900px; text-align: left; }
        h2 { color: #5c4033; text-align: center; }

        /* Өлең мәтіні */
        #poem-content-display {
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            width: 100%;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            background: #fafafa;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
            line-height: 1.7;
        }

        /* 5. Автор hero баннері */
        .author-hero {
            position: relative;
            width: 100%;
            background: linear-gradient(135deg, #3b1a08 0%, #7a3e1e 40%, #c8922a 100%);
            padding: 70px 20px 40px;
            text-align: center;
            overflow: hidden;
            margin-bottom: 0;
        }
        .author-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");
        }
        .author-hero img {
            display: block;
            width: 100%;
            max-width: 450px;
            height: auto;
            border-radius: 10px;
            margin: 0 auto;
            box-shadow: 0 8px 28px rgba(0,0,0,0.5);
            border: 3px solid rgba(255,255,255,0.25);
            position: relative;
            z-index: 1;
        }
        .author-hero-name {
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            margin-top: 14px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            position: relative;
            z-index: 1;
        }
        .author-hero.empty { display: none; }

        /* Навигация батырмалары */
        .nav-wrapper { text-align: center; margin: 20px 0; }
        .back-btn { display: inline-block; margin: 10px 10px 0 0; padding: 10px 18px; background: #8b5e3c; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; transition: 0.3s; }
        .back-btn:hover { background: #6e472c; }

        /* 2. Scroll батырмалары — жоғарыда, меню қасында горизонталь */
        .scroll-buttons { position: fixed; top: 15px; left: 70px; display: flex; gap: 6px; z-index: 1001; }
        .scroll-btn { background: #8b5e3c; color: white; border: none; padding: 10px 14px; border-radius: 6px; font-size: 18px; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .scroll-btn:hover { transform: scale(1.05); }

        /* Ұсыныстар */
        .related-poems { margin: 20px auto; max-width: 900px; padding: 15px; background: #fdf6f0; border-left: 4px solid #8b5e3c; border-radius: 6px; }
        .related-poems p { font-weight: bold; margin-bottom: 10px; color: #333; }
        .poem-btn { display: block; text-decoration: none; color: white; background: #8b5e3c; padding: 10px 15px; border-radius: 6px; margin: 6px 0; text-align: center; font-weight: bold; transition: all 0.3s ease; }
        .poem-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.3); background: #6e472c; }

        /* Пікірлер */
        .comments-section { max-width: 900px; margin: 60px auto 40px; padding: 0 20px; font-family: Arial, sans-serif; }
        .comments-title { font-size: 1.4rem; font-weight: 700; color: #3b1f0a; border-bottom: 2px solid #c8a06a; padding-bottom: 10px; margin-bottom: 24px; }
        .auth-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        #user-info { display: none; align-items: center; gap: 10px; }
        #user-photo { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid #c8a06a; }
        #user-name { font-size: 0.95rem; color: #3b1f0a; font-weight: 600; }
        .auth-btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        #login-btn { background: #4285f4; color: #fff; }
        #login-btn:hover { background: #2f6fd8; }
        #logout-btn { display: none; background: #f1e8db; color: #7a4520; }
        #logout-btn:hover { background: #e2d0bb; }
        #comment-form { display: none; margin-bottom: 28px; }
        #comment-input { width: 100%; min-height: 90px; padding: 12px 14px; border: 1.5px solid #d4b896; border-radius: 10px; font-size: 0.95rem; color: #2c1a0a; background: #fffaf5; resize: vertical; box-sizing: border-box; font-family: inherit; transition: border-color 0.2s; }
        #comment-input:focus { outline: none; border-color: #a0622a; }
        #submit-btn { margin-top: 10px; padding: 10px 24px; background: #8B4513; color: #fff; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        #submit-btn:hover { background: #6b3410; }
        #submit-btn:disabled { background: #c4a882; cursor: not-allowed; }
        #login-note { color: #9a7a5a; font-size: 0.9rem; margin-bottom: 20px; }
        .comment-card { display: flex; gap: 14px; padding: 16px; background: #fffaf5; border: 1px solid #e8d5ba; border-radius: 12px; margin-bottom: 14px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .comment-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #c8a06a; flex-shrink: 0; }
        .comment-body { flex: 1; }
        .comment-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
        .comment-name { font-weight: 700; font-size: 0.95rem; color: #3b1f0a; }
        .comment-date { font-size: 0.8rem; color: #b08060; }
        .comment-text { font-size: 0.95rem; color: #4a3020; line-height: 1.6; margin: 0; white-space: pre-wrap; }
        .loading-text, .no-comments, .error-text { text-align: center; color: #9a7a5a; padding: 20px 0; font-size: 0.95rem; }
        .delete-btn { background: none; border: none; color: #ff4d4d; cursor: pointer; font-size: 0.8rem; margin-left: 10px; padding: 0; text-decoration: underline; }
        .delete-btn:hover { color: #cc0000; }
    </style>
</head>
<body>

    <!-- 1. Мәзір — menu.css: сол жақта fixed sidebar -->
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <nav id="menu">
        <button onclick="location.href='index.html'">🏠 Басты бет</button>
        <button onclick="location.href='alash.html'">📜 Алаш зиялылары</button>
        <button onclick="location.href='writers.html'">📚 Қазақ жазушылары</button>
        <button onclick="location.href='poets.html'">✍️ Ақындар</button>
        <button onclick="location.href='poemGame.html'">🎮 Қаламгер ойыны</button>
        <button onclick="location.href='contact.html'">📩 Байланыс</button>
        <button onclick="location.href='poems.html'">📝 Өлеңдер</button>
        <button onclick="location.href='shygarms.html'">📑 Шығармалар</button>
    </nav>

    <!-- 2. Scroll батырмалары — жоғарыда горизонталь, меню қасында -->
    <div class="scroll-buttons">
        <button class="scroll-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">↑</button>
        <button class="scroll-btn" onclick="window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'})">↓</button>
    </div>

    <!-- 5. Автор hero баннері — түсті фон үстінде сурет + аты -->
    <div id="author-hero" class="author-hero empty">
        <img id="author-hero-img" src="" alt="Автор">
        <div id="author-hero-name" class="author-hero-name"></div>
    </div>

    <!-- Аудио плеер -->
    <div id="audio-player-container"></div>

    <!-- Өлең мәтіні -->
    <div class="card">
        <h2 id="poem-title-display"></h2>
        <pre id="poem-content-display"></pre>
    </div>

    <!-- 3 & 4. Батырмалар дұрыс мәтінмен -->
    <div id="navigation-buttons" class="nav-wrapper">
        <a href="poems.html" class="back-btn">← Өлеңдер бетіне</a>
        <a id="author-link" href="#" class="back-btn">← Автор бетіне</a>
    </div>

    <!-- Ұсыныстар -->
    <div id="related-poems-container" class="related-poems">
        <p>Сізге ұнауы мүмкін ⬇️</p>
        <div id="suggestions-list">Жүктелуде...</div>
    </div>

    <!-- Пікірлер -->
    <section id="comments-section" class="comments-section"></section>

    <script src="js/menu.js"></script>
    <script src="js/audio-script.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, query, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_aLF4dK_m0jvkbSzhTWo3rsP7yx5uoXw",
            authDomain: "adebiet-ordasy.firebaseapp.com",
            projectId: "adebiet-ordasy",
            storageBucket: "adebiet-ordasy.appspot.com",
            messagingSenderId: "776364024545",
            appId: "1:331787955330:web:a77853b5bffdb44bed989b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function initPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const poemId = urlParams.get('id');
            if (!poemId) {
                document.getElementById('poem-title-display').innerText = "Өлең табылмады";
                return;
            }

            try {
                const docRef = doc(db, "published_content", poemId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();

                    // Тақырып пен мәтін
                    document.getElementById('poem-title-display').innerText = data.workTitle || "Тақырыпсыз";
                    document.getElementById('poem-content-display').innerText = data.work || "Мәтін жоқ";
                    document.title = (data.workTitle || "Өлең") + " | Әдебиет ордасы";

                    // 5. Hero баннері
                    const imgSrc = data.photoUrl || data.authorImg;
                    if (imgSrc) {
                        const hero = document.getElementById('author-hero');
                        document.getElementById('author-hero-img').src = imgSrc;
                        document.getElementById('author-hero-img').alt = data.authorName || 'Автор';
                        if (data.authorName) {
                            document.getElementById('author-hero-name').innerText = data.authorName;
                        }
                        hero.classList.remove('empty');
                    }

                    // Аудио плеер
                    if (data.audioUrl && typeof initDynamicPlayer === "function") {
                        initDynamicPlayer(data);
                    }

                    // 4. Автор бетіне сілтеме
                    if (data.authorId) {
                        document.getElementById('author-link').href = `author-profile.html?id=${data.authorId}`;
                    }

                    loadSuggestions(poemId);

                } else {
                    document.getElementById('poem-title-display').innerText = "Өлең табылмады";
                }
            } catch (error) {
                console.error("Firebase қатесі:", error);
                document.getElementById('poem-title-display').innerText = "Қате орын алды";
            }
        }

        async function loadSuggestions(currentId) {
            try {
                const q = query(collection(db, "published_content"), limit(4));
                const querySnapshot = await getDocs(q);
                let html = "";
                querySnapshot.forEach((docItem) => {
                    if (docItem.id !== currentId) {
                        const d = docItem.data();
                        html += `<a href="poem-view.html?id=${docItem.id}" class="poem-btn">📖 ${d.workTitle || "Өлең"}</a>`;
                    }
                });
                document.getElementById('suggestions-list').innerHTML = html || "<p>Ұсыныс жоқ</p>";
            } catch (error) {
                console.error("Ұсыныстар қатесі:", error);
                document.getElementById('suggestions-list').innerHTML = "<p>Жүктеу қатесі</p>";
            }
        }

        initPage();
    </script>

    <script type="module" src="/adebietordasy/comments.js"></script>

</body>
</html>
