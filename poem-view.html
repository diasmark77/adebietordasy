    <style>

<div id="audio-btn-wrapper" style="text-align:center; margin: 16px 0 0; display: none;">
  <button id="zhurek-toggle" onclick="togglePlayer()" style="display: inline-flex; align-items: center; gap: 7px; background: #8B4513; color: #fff; border: none; border-radius: 20px; padding: 8px 20px; font-size: 14px; cursor: pointer;">

<!-- Плеер контейнері -->
<div id="zhurek-player-wrap">
  <div class="player-container">
    <audio id="zhurek-audio" preload="metadata"></audio>
    <div id="audio-title" style="font-size:15px; font-weight:600; color:#5a2a00;">🎵 Жүктелуде...</div>
    
    <div style="display:flex; align-items:center; gap:10px; width:100%;">
      <span id="zhurek-cur" style="font-size:12px; color:#999;">0:00</span>
      <input type="range" id="zhurek-seek" min="0" max="100" step="0.1" value="0" style="flex:1; accent-color:#8B4513;">
      <span id="zhurek-dur" style="font-size:12px; color:#999;">0:00</span>
    </div>

    <div style="display:flex; align-items:center; gap:16px;">
      <button onclick="zhurekRew()" style="background:none; border:1px solid #c8914f; border-radius:50%; width:38px; height:38px; cursor:pointer;">⏪</button>
      <button onclick="zhurekPlayPause()" id="zhurek-play-btn" style="background:#8B4513; border:none; border-radius:50%; width:52px; height:52px; color:white; cursor:pointer; font-size:20px;">▶</button>
      <button onclick="zhurekFwd()" style="background:none; border:1px solid #8B4513; border-radius:50%; width:38px; height:38px; cursor:pointer;">⏩</button>
    </div>
  </div>
</div>

<!-- Өлең мәтіні -->

<!-- FIREBASE ЛОГИКАСЫ -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        // ОСЫ ЖЕРГЕ СЕНІҢ Firebase Config-ің қойылады
        apiKey: "AIzaSyC_...", 
        projectId: "adebiet-ordasy",
        // ...
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // URL-ден ID-ні оқу
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    async function loadData() {
        if (!id) return;
        const docRef = doc(db, "published_content", id);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
            const data = docSnap.data();
            
            // Мәліметтерді толтыру
            document.getElementById('poem-title').innerText = data.name + ' "' + data.workTitle + '"';
            document.getElementById('poem-content').innerText = data.work;
            document.title = data.workTitle + " | Әдебиет ордасы";

            // Аудио бар ма?
            if (data.audioUrl) {
                document.getElementById('audio-btn-wrapper').style.display = 'block';
                document.getElementById('zhurek-audio').src = data.audioUrl;
                document.getElementById('audio-title').innerText = "🎵 " + data.workTitle + " (Аудио)";
            }
        }
    }
    loadData();
</script>
